<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<title>更新紀錄 · kiuno-anime-viewer</title>
<link rel="stylesheet" href="styles.css?v=4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/%3E%3Cline x1='9' y1='10' x2='15' y2='10'/%3E%3Cline x1='9' y1='14' x2='13' y2='14'/%3E%3C/svg%3E">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  .changelog-page {
    padding: var(--space-5) var(--space-3) 80px var(--space-7);
    max-width: 880px;
    margin: 0 auto;
    position: relative;
  }
  .changelog-page h1 {
    display: inline-flex;
    align-items: center;
    gap: var(--space-3);
    font: 700 var(--fs-display)/1.15 var(--font-display);
    margin: 0 0 var(--space-2);
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  .changelog-page h1 .i { color: var(--accent); }
  .changelog-page__intro {
    color: var(--fg-muted);
    font: 400 var(--fs-body)/1.65 var(--font-body);
    margin: 0 0 var(--space-6);
  }
  /* Timeline 垂直線 (從第一個 dot 起延伸到底) */
  .changelog-page::before {
    content: "";
    position: absolute;
    top: 140px;
    bottom: 80px;
    left: calc(var(--space-7) - 26px);
    width: 2px;
    background: linear-gradient(180deg, var(--border-strong), var(--border) 50%, transparent);
  }
  .changelog-page__error {
    color: var(--destructive);
    padding: var(--space-3) var(--space-4);
    background: var(--bg-elev);
    border: 1px solid var(--destructive);
    border-radius: var(--radius-sm);
    margin-bottom: var(--space-5);
  }
  .version-block {
    position: relative;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-4) var(--space-5);
    margin-bottom: var(--space-4);
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .version-block:hover { border-color: var(--border-strong); }
  /* Timeline node dot */
  .version-block::before {
    content: "";
    position: absolute;
    left: calc(-1 * var(--space-5) - 7px);
    top: var(--space-5);
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--bg-elev-2);
    border: 2px solid var(--border-strong);
    z-index: 1;
    transition: background var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  .version-block:hover::before { border-color: var(--fg-muted); }
  .version-block.current {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .version-block.current::before {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 16px rgba(129,140,248,0.4);
  }
  .version-block__head {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .version-block__num {
    font: 700 var(--fs-h2) var(--font-mono);
    color: var(--accent);
    letter-spacing: 0;
  }
  .version-block.current .version-block__num::after {
    content: "目前版本";
    display: inline-block;
    font: 600 var(--fs-micro) var(--font-body);
    color: var(--accent-strong);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    padding: 2px var(--space-2);
    border-radius: var(--radius-pill);
    margin-left: var(--space-2);
    vertical-align: middle;
    letter-spacing: 0.04em;
  }
  .version-block__date {
    color: var(--fg-faint);
    font: 500 var(--fs-caption) var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .version-block__summary {
    color: var(--fg);
    font: 400 var(--fs-body)/1.7 var(--font-body);
    margin: 0 0 var(--space-3);
  }
  .change-section { margin-top: var(--space-3); }
  .change-label {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font: 600 var(--fs-micro) var(--font-body);
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-pill);
    margin-bottom: var(--space-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid transparent;
  }
  .change-label::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .change-label.added    { background: var(--accent-soft); color: var(--accent);     border-color: rgba(129,140,248,0.3); }
  .change-label.fixed    { background: rgba(252,211,77,0.12); color: var(--star);    border-color: rgba(252,211,77,0.35); }
  .change-label.removed  { background: rgba(251,113,133,0.12); color: var(--heart);  border-color: rgba(251,113,133,0.35); }
  .change-label.ui       { background: rgba(167,139,250,0.15); color: var(--violet); border-color: rgba(167,139,250,0.35); }
  .change-label.infra    { background: rgba(148,163,184,0.12); color: var(--fg-muted); border-color: rgba(148,163,184,0.3); }
  .change-list {
    list-style: none;
    padding: 0; margin: var(--space-2) 0 0;
  }
  .change-list li {
    padding: var(--space-1) 0 var(--space-1) var(--space-5);
    position: relative;
    font: 400 var(--fs-body-sm)/1.7 var(--font-body);
    color: var(--fg);
  }
  .change-list li::before {
    content: "";
    position: absolute;
    left: var(--space-3);
    top: 0.85em;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--fg-faint);
  }

  @media (min-width: 600px) {
    .changelog-page { padding: var(--space-6) var(--space-5) 80px var(--space-8); }
    .changelog-page::before { left: calc(var(--space-8) - 28px); top: 160px; }
  }
</style>
</head>
<body x-data="changelog()" x-cloak x-init="init()" data-mark-seen="version">

<header class="header">
  <div class="header__row1">
    <div class="header__title">
      <svg class="i i--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="13" y2="14"/></svg>
      更新紀錄<small>kiuno</small>
    </div>
    <div class="header__nav">
      <a href="index.html">卡片</a>
      <a href="graph.html">知識圖</a>
      <a href="recommends.html" class="nav-link-recommends">留言</a>
      <a href="ritual.html?src=all" class="nav-link-ritual">召喚陣</a>
      <a href="changelog.html" class="active version-link nav-link-changelog" x-text="version ? `v${version}` : '更新紀錄'"></a>
    </div>
  </div>
</header>

<main class="changelog-page">
  <h1>
    <svg class="i i--xl" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="13" y2="14"/></svg>
    更新紀錄
  </h1>
  <p class="changelog-page__intro">
    每次推上 GitHub 後版號 +1，新增 / 修改 / 刪除動畫都會在此頁面記下。
  </p>
  <div x-show="loadError" class="changelog-page__error" x-text="loadError"></div>
  <template x-for="(v, idx) in versions" :key="v.version">
    <article class="version-block" :class="{current: idx === 0}">
      <div class="version-block__head">
        <span class="version-block__num" x-text="`v${v.version}`"></span>
        <span class="version-block__date" x-text="v.date"></span>
      </div>
      <p class="version-block__summary" x-text="v.summary"></p>

      <template x-for="(items, label) in v.changes" :key="label">
        <div class="change-section" x-show="items && items.length > 0">
          <span class="change-label" :class="label" x-text="labelText(label)"></span>
          <ul class="change-list">
            <template x-for="item in items" :key="item">
              <li x-text="item"></li>
            </template>
          </ul>
        </div>
      </template>
    </article>
  </template>
</main>

<script>
function changelog() {
  return {
    version: "",
    versions: [],
    loadError: "",

    async init() {
      try {
        const v = await (await fetch("data/version.json", {cache:"no-cache"})).json();
        this.version = v.current || "";
      } catch (e) {}
      try {
        const c = await (await fetch("data/changelog.json", {cache:"no-cache"})).json();
        this.versions = c.versions || [];
      } catch (e) {
        this.loadError = "讀 changelog 失敗：" + e.message;
      }
    },

    labelText(key) {
      return {
        added: "新增",
        fixed: "修正",
        removed: "刪除",
        ui: "介面",
        infra: "基礎建設",
      }[key] || key;
    },
  };
}
</script>
<script type="module" src="indicator.js?v=1"></script>
</body>
</html>
