<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<title>kiuno-anime-viewer</title>
<link rel="stylesheet" href="styles.css?v=4" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='20' height='15' x='2' y='3' rx='2' ry='2'/%3E%3Cpath d='M8 21h8'/%3E%3Cpath d='M12 17v4'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body x-data="viewer" x-cloak>

<header class="header">
  <div class="header__row1">
    <div class="header__title">
      <svg class="i i--lg" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="15" x="2" y="3" rx="2" ry="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      kiuno<small>anime</small>
    </div>
    <div class="header__nav">
      <a href="index.html" class="active">卡片</a>
      <a href="graph.html">知識圖</a>
      <a href="recommends.html" class="nav-link-recommends">留言</a>
      <a href="ritual.html?src=all" class="nav-link-ritual">召喚陣</a>
      <a href="changelog.html" class="version-link nav-link-changelog" x-text="appVersion ? `v${appVersion}` : ''"></a>
    </div>
    <div class="search">
      <input type="search"
             placeholder="搜尋 標題 / 簡介 / tag …"
             x-model="query"
             @input.debounce.150ms="rebuildSearch()"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
  </div>

  <div class="header__row2">
    <button class="toggle"
            :aria-pressed="showFavoritesOnly"
            @click="showFavoritesOnly = !showFavoritesOnly">
      <svg class="i" :class="showFavoritesOnly ? 'i--solid' : ''" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
      <span>我的最愛</span>
      <span x-show="favoritesList.length > 0" x-text="`(${favoritesList.length})`" style="opacity:0.7"></span>
    </button>

    <select class="pill-btn" x-model="sortBy" aria-label="排序方式">
      <option value="title">標題</option>
      <option value="year_desc">新→舊</option>
      <option value="year_asc">舊→新</option>
      <option value="score_desc">星級高→低</option>
      <option value="self_rating_desc">自評高→低</option>
    </select>

    <button class="pill-btn" @click="$refs.starsModal.showModal()" :title="`最低星級 ≥ ${minStarsRaw}`">
      <svg class="i i--solid" viewBox="0 0 24 24" style="color:var(--star)" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
      ≥ <span x-text="minStarsRaw"></span>
    </button>

    <button class="pill-btn" @click="exportFavorites()" :disabled="favoritesList.length === 0" aria-label="匯出我的最愛" title="匯出我的最愛">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="pill-btn" @click="$refs.favImport.click()" aria-label="匯入我的最愛" title="匯入我的最愛">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <input type="file" accept="application/json,.json" x-ref="favImport" @change="importFavorites($event)" style="display:none" />
    <button class="pill-btn" @click="resetFilters()" aria-label="重設過濾" title="重設過濾">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><polyline points="21 3 21 8 16 8"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><polyline points="3 21 3 16 8 16"/></svg>
    </button>
    <button class="pill-btn ritual-btn-all" @click="openRitual('all')" aria-label="召喚陣" title="召喚陣：從全部動畫隨機抽 10 部 3D 展示">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.91 5.18L4.91 10.09 10.09 13.91 12 19.09 13.91 13.91 19.09 10.09 13.91 8.18z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
    </button>

    <span class="count" x-text="`${filtered.length} / ${all.length}`"></span>
  </div>
</header>

<!-- 最低星級 modal (mobile-friendly) -->
<dialog x-ref="starsModal" style="border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-5); background:var(--bg-elev); color:var(--fg); min-width:280px; box-shadow:var(--shadow-xl);">
  <form method="dialog" style="display:flex; flex-direction:column; gap:var(--space-4);">
    <h3 style="margin:0; font:600 var(--fs-h3) var(--font-display); display:flex; align-items:center; gap:var(--space-2);">
      <svg class="i i--solid" viewBox="0 0 24 24" style="color:var(--star)" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
      最低星級 ≥ <span x-text="minStarsRaw" style="color:var(--accent); font-variant-numeric:tabular-nums;"></span>
    </h3>
    <input type="range" min="0" max="5" step="0.5"
           :value="minStarsRaw"
           @input="minStarsRaw = $event.target.value; minStars = $event.target.value"
           style="width:100%; accent-color:var(--accent);" />
    <div style="display:flex; gap:var(--space-2); justify-content:flex-end;">
      <button type="submit" class="pill-btn">關閉</button>
    </div>
  </form>
</dialog>

<!-- 季別新番推薦（owner 手動策劃，由 data/season_picks.json 驅動） -->
<section class="season-bar" x-show="seasonPicks.ids.length > 0" x-cloak>
  <div class="season-bar__header">
    <span class="season-bar__title" x-text="seasonPicks.season_label"></span>
    <span class="count" x-text="`${seasonPicks.ids.length}`"></span>
    <span class="updated" x-show="seasonPicks.updated_at"
          x-text="`更新 ${seasonPicks.updated_at}`"></span>
    <div class="actions">
      <button class="ritual-btn" @click="openRitual('season')" aria-label="召喚陣" title="召喚陣：從這個清單隨機抽 10 部 3D 展示">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.91 5.18L4.91 10.09 10.09 13.91 12 19.09 13.91 13.91 19.09 10.09 13.91 8.18z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
      </button>
      <button x-show="seasonPicks.ids.length > seasonDefaultLimit"
              @click="seasonExpanded = !seasonExpanded"
              x-text="seasonExpanded ? '收合' : `+${seasonPicks.ids.length - seasonDefaultLimit}`"></button>
    </div>
  </div>
  <div class="recommend-cards">
    <template x-for="id in (seasonExpanded ? seasonPicks.ids : seasonPicks.ids.slice(0, seasonDefaultLimit))" :key="id">
      <div class="mini-card" @click="selectById(id)" x-show="animeById(id)">
        <div class="cover" :style="`background-image:url('${animeById(id) ? coverFor(animeById(id)) : ''}')`"></div>
        <div class="title" x-text="animeById(id)?.titles?.primary_zh || animeById(id)?.titles?.ja_romaji || id"></div>
      </div>
    </template>
  </div>
</section>

<!-- 推薦清單橫幅 -->
<section class="recommend-bar" x-show="recommendList.length > 0" x-cloak>
  <div class="recommend-bar__header">
    <span class="star-glyph">★</span>
    <span>久野的推薦清單</span>
    <span class="count" x-text="`${recommendList.length}`"></span>
    <div class="actions">
      <button class="ritual-btn" @click="openRitual('recommend')" aria-label="召喚陣" title="召喚陣：從這個清單隨機抽 10 部 3D 展示">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3-1.91 5.18L4.91 10.09 10.09 13.91 12 19.09 13.91 13.91 19.09 10.09 13.91 8.18z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
      </button>
      <button x-show="recommendList.length > 1" @click="reshuffleRecommend()" aria-label="重新洗牌" title="重新洗牌">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button x-show="recommendList.length > recommendDefaultLimit" @click="recommendExpanded = !recommendExpanded"
              x-text="recommendExpanded ? '收合' : `+${recommendList.length - recommendDefaultLimit}`"></button>
    </div>
  </div>
  <div class="recommend-cards">
    <template x-for="id in (recommendExpanded ? shuffledRecommend : shuffledRecommend.slice(0, recommendDefaultLimit))" :key="id">
      <div class="mini-card" @click="selectById(id)" x-show="animeById(id)">
        <div class="cover" :style="`background-image:url('${animeById(id) ? coverFor(animeById(id)) : ''}')`"></div>
        <div class="title" x-text="animeById(id)?.titles?.primary_zh || animeById(id)?.titles?.ja_romaji || id"></div>
      </div>
    </template>
  </div>
</section>

<!-- 分類 / 標籤 chips -->
<section class="chips-bar" x-show="topCategories.length > 0 || activeTags.length > 0" x-cloak>
  <template x-for="cat in topCategories" :key="cat">
    <span class="chip"
          :class="{active: activeCats.includes(cat)}"
          @click="toggleCat(cat)" x-text="cat"></span>
  </template>
  <template x-for="tag in activeTags" :key="tag">
    <span class="chip active chip-remove" @click="toggleTag(tag)" x-text="tag"></span>
  </template>
</section>

<!-- Banner: 載入錯誤 / 本機模式 -->
<div class="banner" x-show="loadError" x-cloak style="color:var(--review)" x-text="loadError"></div>
<div class="banner local-mode" x-show="isOwnerMode && !isReadOnlyShared && storageMode === 'local' && recommendList.length > 0" x-cloak>
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
  <span>推薦清單為本機模式</span>
  <button @click="resetToShared()">重新讀取分享</button>
</div>

<!-- 卡片 grid -->
<main class="cards" :class="{'with-detail': !!selected}">
  <template x-for="rec in displayed" :key="rec.id">
    <div class="card" @click="select(rec)" tabindex="0" @keydown.enter="select(rec)">
      <div class="cover" :style="`background-image:url('${coverFor(rec)}')`">
        <template x-if="isOwnerMode">
          <button type="button" class="icon star"
                  :class="isRecommended(rec.id) ? 'filled' : ''"
                  @click.stop="toggleRecommend(rec.id)"
                  :aria-label="isRecommended(rec.id) ? '從推薦移除' : '加入推薦'"
                  :title="isRecommended(rec.id) ? '從推薦移除' : '加入推薦'">
            <svg class="i" :class="isRecommended(rec.id) ? 'i--solid' : ''" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>
          </button>
        </template>
        <button type="button" class="icon share"
                @click.stop="shareAnime(rec)"
                aria-label="分享這部動畫"
                title="分享這部動畫">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button type="button" class="icon heart"
                :class="isFavorite(rec.id) ? 'filled' : ''"
                @click.stop="toggleFavorite(rec.id)"
                :aria-label="isFavorite(rec.id) ? '從我的最愛移除' : '加入我的最愛'"
                :title="isFavorite(rec.id) ? '從我的最愛移除' : '加入我的最愛'">
          <svg class="i" :class="isFavorite(rec.id) ? 'i--solid' : ''" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
        </button>
      </div>
      <div class="info">
        <div class="title" x-text="rec.titles.primary_zh || rec.titles.ja_romaji || rec.id"></div>
        <div class="meta">
          <span x-text="rec.year || '?'"></span>
          <span class="stars" x-text="renderStars(rec.rating?.score)"></span>
        </div>
      </div>
    </div>
  </template>
  <div class="empty" x-show="filtered.length === 0 && !loadError">沒有符合的動畫</div>
</main>
<div class="load-sentinel" x-ref="loadSentinel" x-show="hasMore" x-cloak>
  <span class="load-sentinel__hint" x-text="`載入更多… (${displayed.length} / ${filtered.length})`"></span>
</div>

<!-- 詳情 drawer (mobile = bottom; desktop = right side panel) -->
<div class="drawer-backdrop" :class="{open: !!selected}" @click="close()"></div>
<aside class="drawer" :class="{open: !!selected}" role="dialog" aria-modal="true">
  <div class="drawer__handle" @click="close()"></div>
  <button class="drawer__close" @click="close()" aria-label="關閉">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="drawer__body">
    <template x-if="selected">
      <div>
        <img class="detail__cover"
             :src="coverFor(selected)"
             :alt="selected.titles.primary_zh"
             onerror="this.style.display='none'" />
        <div class="detail__content">
          <h2 class="detail__name" x-text="selected.titles.primary_zh || selected.titles.ja_romaji"></h2>
          <div class="detail__alias">
            <div x-show="selected.titles.ja" x-text="selected.titles.ja"></div>
            <div x-show="selected.titles.ja_romaji" x-text="selected.titles.ja_romaji"></div>
            <div x-show="selected.titles.en" x-text="selected.titles.en"></div>
          </div>

          <div class="detail__meta">
            <span x-show="selected.year"><span x-text="selected.year"></span> 年</span>
            <span x-show="selected.season" x-text="selected.season"></span>
            <span x-show="selected.episodes"><span x-text="selected.episodes"></span> 集</span>
            <span x-show="selected.format" x-text="selected.format"></span>
            <span x-show="selected.studios?.length" x-text="selected.studios.join(' · ')"></span>
          </div>

          <div class="detail__rating">
            <div class="row main">
              <span>客觀星級</span>
              <span class="stars" x-text="renderStars(selected.rating?.score)"></span>
            </div>
            <template x-for="[k, v] in Object.entries(selected.rating?.sources || {})" :key="k">
              <div class="row">
                <span x-text="k"></span>
                <span x-text="`${v.score} / ${v.scale}`"></span>
              </div>
            </template>
            <div class="row self" x-show="selected.user?.self_rating_raw != null">
              <span>使用者自評</span>
              <span x-text="selected.user.self_rating_raw + ' 星'"></span>
            </div>
          </div>

          <div class="detail__synopsis"
               x-text="selected.synopsis_zh || '(Bangumi 暫無中文簡介，可在 data/manual_overrides.json 自行補上)'"></div>

          <div class="detail__section" x-show="selected.categories?.length">
            <div class="detail__label">分類</div>
            <div class="detail__chips">
              <template x-for="c in selected.categories || []" :key="c">
                <span class="chip" @click="toggleCat(c); close()" x-text="c"></span>
              </template>
            </div>
          </div>

          <div class="detail__section" x-show="selected.tags?.length">
            <div class="detail__label">標籤</div>
            <div class="detail__chips">
              <template x-for="t in selected.tags || []" :key="t">
                <span class="chip" @click="toggleTag(t); close()" x-text="t"></span>
              </template>
            </div>
          </div>

          <div class="detail__links" x-show="Object.keys(selected.external_links || {}).length">
            <template x-for="[k, url] in Object.entries(selected.external_links || {})" :key="k">
              <a :href="url" target="_blank" rel="noopener" x-text="k"></a>
            </template>
          </div>

          <div class="detail__section detail__comments">
            <div class="detail__label">
              留言
              <span class="anime-comment__count" x-show="animeComments.length > 0"
                    x-text="`(${animeComments.length})`"></span>
            </div>

            <div class="anime-comment__banner" x-show="!fbConfigured" x-cloak>
              <svg class="i" viewBox="0 0 24 24" style="color:var(--destructive)" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
              <span>留言系統尚未設定（本機 firebase-config.js 未填值）</span>
            </div>
            <div class="anime-comment__empty"
                 x-show="fbConfigured && !firebaseReady" x-cloak>載入留言系統中…</div>

            <template x-if="firebaseReady">
              <div>
                <div class="detail__comments-list">
                  <template x-for="c in animeComments" :key="c.id">
                    <article class="anime-comment">
                      <div class="anime-comment__head">
                        <strong class="anime-comment__name" x-text="c.nickname"></strong>
                        <time class="anime-comment__time"
                              :datetime="c.createdAt?.toDate?.().toISOString()"
                              x-text="formatTime(c.createdAt)"></time>
                      </div>
                      <p class="anime-comment__body" x-text="c.comment"></p>
                    </article>
                  </template>
                  <div class="anime-comment__empty"
                       x-show="!commentLoading && animeComments.length === 0">
                    還沒有留言，當第一個吧
                  </div>
                  <div class="anime-comment__empty" x-show="commentLoading">載入中…</div>
                </div>
                <form class="anime-comment-form" @submit.prevent="submitAnimeComment()">
                  <input type="text" x-model="commentForm.nickname" maxlength="20" required
                         placeholder="暱稱" autocomplete="off"
                         :disabled="commentSubmitting" />
                  <textarea x-model="commentForm.text" rows="3" maxlength="500" required
                            placeholder="說點什麼…(5-500 字)"
                            :disabled="commentSubmitting"></textarea>
                  <div class="anime-comment-form__row">
                    <span class="anime-comment-form__count"
                          x-text="`${commentForm.text.length}/500`"></span>
                    <button type="submit" class="pill-btn submit-btn"
                            :disabled="commentSubmitting"
                            x-text="commentSubmitting ? '送出中…' : '送出留言'"></button>
                  </div>
                </form>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</aside>

<!-- Toast -->
<div class="toast" id="globalToast"></div>

<script type="module">
import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.js";
import { collectAudit, showToast, formatTime } from "./js/utils.js?v=1";
import { firebaseConfig, isConfigured as fbIsConfigured } from "./firebase-config.js?v=1";

Alpine.data("viewer", () => ({
    all: [],
    byId: {},
    selected: null,
    query: "",
    sortBy: "title",
    minStars: 0,
    minStarsRaw: 0,
    activeCats: [],
    activeTags: [],
    fuse: null,
    matchedIds: null,
    loadError: "",
    topCategories: [],
    recommendList: [],
    shuffledRecommend: [],
    seasonPicks: { season_label: "", ids: [], updated_at: "" },
    seasonExpanded: false,
    favoritesList: [],
    showFavoritesOnly: false,
    recommendExpanded: false,
    isOwnerMode: false,
    storageMode: "host",
    isReadOnlyShared: false,
    viewportWidth: window.innerWidth,
    appVersion: "",
    pageSize: 40,
    displayLimit: 40,
    _scrollObserver: null,
    // 個別動漫留言板
    fbConfigured: fbIsConfigured,
    firebaseReady: false,
    _fbDb: null,
    _fb: null,
    animeComments: [],
    commentForm: { nickname: "", text: "" },
    commentSubmitting: false,
    commentLoading: false,
    _commentUnsub: null,
    formatTime,

    async init() {
      const h = location.hostname;
      const params0 = new URLSearchParams(location.search);
      this.isOwnerMode = (h === '127.0.0.1' || h === 'localhost' || h === '' ||
                          params0.get('owner') === '1');

      // 版本號 (顯示在 header)
      try {
        const vr = await fetch("data/version.json", { cache: "no-cache" });
        if (vr.ok) { const v = await vr.json(); this.appVersion = v.current || ""; }
      } catch (e) {}

      // Firebase 後端 (lazy init，背景跑，不阻塞頁面渲染)
      this._initFirebase();

      await this.loadUserState();
      try {
        const resp = await fetch("data/anime.json", { cache: "no-cache" });
        if (!resp.ok) throw new Error(resp.status + " " + resp.statusText);
        const db = await resp.json();
        this.all = Object.values(db.anime || {});
        this.byId = db.anime || {};
        this.computeTopCategories();
        this.rebuildSearch();
        const before = this.recommendList.length + this.favoritesList.length;
        this.recommendList = this.recommendList.filter(id => this.byId[id]);
        this.favoritesList = this.favoritesList.filter(id => this.byId[id]);
        const after = this.recommendList.length + this.favoritesList.length;
        if (before !== after) { this.persistRecommend(); this.persistFavorites(); }
        this.reshuffleRecommend();

        // 季別新番推薦（owner 編輯 data/season_picks.json 換季更新）
        try {
          const r = await fetch("data/season_picks.json", { cache: "no-cache" });
          if (r.ok) {
            const d = await r.json();
            if (d && Array.isArray(d.ids)) {
              this.seasonPicks = {
                season_label: d.season_label || "當季推薦",
                ids: d.ids.filter(id => this.byId[id]),
                updated_at: d.updated_at || "",
              };
            }
          }
        } catch (e) { /* 沒檔案就不顯示 */ }

        const targetId = params0.get('id');
        if (targetId && this.byId[targetId]) this.select(this.byId[targetId]);

        // 過濾/排序變動 → 回到第一頁
        const resetPaging = () => { this.displayLimit = this.pageSize; };
        this.$watch('query', resetPaging);
        this.$watch('sortBy', resetPaging);
        this.$watch('minStars', resetPaging);
        this.$watch('showFavoritesOnly', resetPaging);
        this.$watch('activeCats', resetPaging);
        this.$watch('activeTags', resetPaging);

        // 接近底部 → 載下一批
        this.$nextTick(() => this._setupInfiniteScroll());

        // ESC closes drawer
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && this.selected) this.close();
        });
        // viewport reactive (recommend bar mobile/desktop count switch)
        window.addEventListener('resize', () => { this.viewportWidth = window.innerWidth; });
      } catch (e) {
        this.loadError = "讀取 anime.json 失敗：" + e.message + "（請先跑 python run.py enrich）";
      }
    },

    async loadUserState() {
      try {
        this.favoritesList = JSON.parse(localStorage.getItem('animeViewer.favorites') || '[]');
      } catch (e) { this.favoritesList = []; }

      const hasLocalRecommendEdits = localStorage.getItem('animeViewer.recommendEdited') === '1';
      let localRecommend = [];
      try {
        localRecommend = JSON.parse(localStorage.getItem('animeViewer.recommend') || '[]');
      } catch (e) {}

      let fileRecommend = null;
      try {
        const r = await fetch("data/user_lists.json", { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d && typeof d === "object" && Array.isArray(d.recommend)) {
            fileRecommend = d.recommend.slice();
          }
        }
      } catch (e) {}

      if (hasLocalRecommendEdits) {
        this.recommendList = localRecommend;
        this.isReadOnlyShared = false;
        if (this.isOwnerMode && localRecommend.length > 0) {
          this._syncRecommendToFile(localRecommend);
        }
      } else if (fileRecommend && fileRecommend.length) {
        this.recommendList = fileRecommend;
        this.isReadOnlyShared = true;
      } else {
        this.recommendList = localRecommend;
        this.isReadOnlyShared = false;
      }
    },

    _syncRecommendToFile(list) {
      fetch("api/user_lists", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recommend: list }),
      }).then(r => {
        if (r.ok) {
          this.storageMode = "host";
          localStorage.removeItem('animeViewer.recommendEdited');
        }
      }).catch(() => {});
    },

    persistRecommend() {
      try {
        localStorage.setItem('animeViewer.recommend', JSON.stringify(this.recommendList));
        localStorage.setItem('animeViewer.recommendEdited', '1');
      } catch (e) {}
      this.isReadOnlyShared = false;
      fetch("api/user_lists", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recommend: this.recommendList }),
      }).then(r => {
        if (r.ok) {
          this.storageMode = "host";
          localStorage.removeItem('animeViewer.recommendEdited');
        } else {
          this.storageMode = "local";
        }
      }).catch(() => { this.storageMode = "local"; });
    },

    persistFavorites() {
      try { localStorage.setItem('animeViewer.favorites', JSON.stringify(this.favoritesList)); } catch (e) {}
    },

    resetToShared() {
      if (!confirm('放棄本機推薦清單編輯，重新從分享檔案讀取？\n（我的最愛不受影響）')) return;
      localStorage.removeItem('animeViewer.recommendEdited');
      localStorage.removeItem('animeViewer.recommend');
      location.reload();
    },

    exportFavorites() {
      if (this.favoritesList.length === 0) return;
      const data = {
        version: 1,
        favorites: this.favoritesList,
        exported_at: new Date().toISOString(),
        titles: this.favoritesList.map(id => {
          const r = this.byId[id];
          return { id, title: r ? (r.titles.primary_zh || r.titles.ja_romaji) : id };
        }),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url; a.download = `my_favorites_${dateStr}.json`; a.click();
      URL.revokeObjectURL(url);
      showToast(`已匯出 ${this.favoritesList.length} 部最愛`);
    },

    async importFavorites(event) {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      event.target.value = '';
      try {
        const d = JSON.parse(text);
        if (!Array.isArray(d.favorites)) throw new Error('JSON 沒有 favorites 陣列');
        const valid = d.favorites.filter(id => this.byId[id]);
        const invalid = d.favorites.length - valid.length;
        const choice = confirm(
          `匯入 ${valid.length} 部最愛${invalid ? `（${invalid} 部找不到動畫被略過）` : ''}\n\n` +
          `按「確定」= 合併\n按「取消」= 取代`
        );
        if (choice) {
          const set = new Set(this.favoritesList);
          for (const id of valid) set.add(id);
          this.favoritesList = Array.from(set);
        } else {
          this.favoritesList = valid;
        }
        this.persistFavorites();
        showToast(`匯入完成 → ${this.favoritesList.length} 部`);
      } catch (e) {
        alert('匯入失敗：' + e.message);
      }
    },

    async shareAnime(rec) {
      const url = new URL(location.href);
      url.searchParams.set('id', rec.id);
      url.hash = '';
      const shareUrl = url.toString();
      const title = rec.titles.primary_zh || rec.titles.ja_romaji || '動畫';
      const score = rec.rating?.score != null ? `${rec.rating.score.toFixed(1)} ★` : '';
      const summary = (rec.synopsis_zh || '').slice(0, 200);
      const text = [
        `《${title}》${rec.year ? '(' + rec.year + ')' : ''}`,
        score && `評分：${score}`,
        summary && `\n${summary}${rec.synopsis_zh && rec.synopsis_zh.length > 200 ? '...' : ''}`,
      ].filter(Boolean).join('\n');

      if (navigator.share) {
        try { await navigator.share({ title, text, url: shareUrl }); return; }
        catch (e) {}
      }
      const fullText = `${text}\n\n${shareUrl}`;
      try {
        await navigator.clipboard.writeText(fullText);
        showToast('已複製分享內容');
      } catch (e) {
        prompt('複製以下內容分享：', fullText);
      }
    },

    get recommendDefaultLimit() {
      return this.viewportWidth >= 600 ? 10 : 5;
    },
    get seasonDefaultLimit() {
      return this.viewportWidth >= 600 ? 10 : 5;
    },
    isRecommended(id) { return this.recommendList.includes(id); },
    isFavorite(id) { return this.favoritesList.includes(id); },
    toggleRecommend(id) {
      if (!this.isOwnerMode) return;
      const i = this.recommendList.indexOf(id);
      if (i >= 0) this.recommendList.splice(i, 1);
      else this.recommendList.unshift(id);
      this.persistRecommend();
      this.reshuffleRecommend();
    },
    openRitual(source) {
      let pool = [];
      if (source === 'season') pool = (this.seasonPicks?.ids || []).slice();
      else if (source === 'recommend') pool = this.recommendList.slice();
      else pool = Object.keys(this.byId);
      pool = pool.filter(id => this.byId[id]);
      if (pool.length === 0) {
        showToast("這個清單目前是空的，沒辦法召喚");
        return;
      }

      // 把整個 pool 存進 sessionStorage，給 ritual.html 做「不重複抽」用
      try {
        sessionStorage.setItem('ritualPool', JSON.stringify({
          pool, source, savedAt: Date.now(),
        }));
      } catch (e) { /* sessionStorage 可能被 disable，fallback 用 URL ids */ }

      // Fisher-Yates 抽前 10 張當初始顯示
      const shuffled = pool.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      const picks = shuffled.slice(0, 10);
      location.href = `ritual.html?ids=${encodeURIComponent(picks.join(','))}&src=${encodeURIComponent(source)}`;
    },
    reshuffleRecommend() {
      const a = this.recommendList.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      this.shuffledRecommend = a;
    },
    toggleFavorite(id) {
      const i = this.favoritesList.indexOf(id);
      if (i >= 0) this.favoritesList.splice(i, 1);
      else this.favoritesList.push(id);
      this.persistFavorites();
    },
    animeById(id) { return this.byId[id]; },
    selectById(id) {
      const rec = this.byId[id];
      if (rec) this.select(rec);
    },
    computeTopCategories() {
      const counts = {};
      for (const r of this.all) for (const c of (r.categories || [])) counts[c] = (counts[c] || 0) + 1;
      this.topCategories = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
    },
    rebuildSearch() {
      this.fuse = new Fuse(this.all, {
        keys: [
          { name: "titles.primary_zh", weight: 3 },
          { name: "titles.ja_romaji", weight: 2 },
          { name: "titles.ja", weight: 2 },
          { name: "titles.en", weight: 2 },
          { name: "synopsis_zh", weight: 1 },
          { name: "tags", weight: 2 },
          { name: "categories", weight: 2 },
          { name: "studios", weight: 1.5 },
          { name: "source_doc_raw", weight: 0.5 },
        ],
        threshold: 0.4,
        ignoreLocation: true,
      });
      if (this.query.trim()) {
        this.matchedIds = new Set(this.fuse.search(this.query).map(r => r.item.id));
      } else {
        this.matchedIds = null;
      }
    },
    toggleCat(c) {
      const i = this.activeCats.indexOf(c);
      if (i >= 0) this.activeCats.splice(i, 1); else this.activeCats.push(c);
    },
    toggleTag(t) {
      const i = this.activeTags.indexOf(t);
      if (i >= 0) this.activeTags.splice(i, 1); else this.activeTags.push(t);
    },
    resetFilters() {
      this.query = ""; this.activeCats = []; this.activeTags = [];
      this.minStars = 0; this.minStarsRaw = 0;
      this.matchedIds = null;
      this.showFavoritesOnly = false;
    },
    select(rec) {
      this.selected = rec;
      this.$nextTick(() => {
        const body = document.querySelector('.drawer__body');
        if (body) body.scrollTop = 0;
      });
      if (this.firebaseReady) this._subscribeAnimeComments(rec.id);
    },
    close() {
      this.selected = null;
      this._unsubscribeAnimeComments();
      this.commentForm.text = "";
    },
    coverFor(rec) {
      const c = rec.cover || {};
      return c.local || c.url || "";
    },

    async _initFirebase() {
      if (!fbIsConfigured) return;
      try {
        const [appMod, fsMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js"),
        ]);
        const apps = appMod.getApps();
        const app = apps.length ? apps[0] : appMod.initializeApp(firebaseConfig);
        this._fbDb = fsMod.getFirestore(app);
        this._fb = fsMod;
        // 暱稱沿用 recommends.html 的 localStorage
        try {
          const savedNick = localStorage.getItem("recommendsNickname");
          if (savedNick) this.commentForm.nickname = savedNick;
        } catch (e) {}
        this.firebaseReady = true;
        // drawer 已經開著 → 立刻訂閱該動漫的留言
        if (this.selected) this._subscribeAnimeComments(this.selected.id);
      } catch (e) {
        console.warn("Firebase init failed", e);
      }
    },

    _subscribeAnimeComments(animeId) {
      this._unsubscribeAnimeComments();
      if (!this.firebaseReady || !this._fbDb || !animeId) return;
      this.commentLoading = true;
      const fs = this._fb;
      // 只用 single-field where (anime_id) + limit；orderBy 改前端做，
      // 避免 Firestore 需要手動建 composite index。
      const q = fs.query(
        fs.collection(this._fbDb, "anime_comments"),
        fs.where("anime_id", "==", animeId),
        fs.limit(100)
      );
      this._commentUnsub = fs.onSnapshot(q, (snap) => {
        const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        docs.sort((a, b) => {
          const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return tb - ta;
        });
        this.animeComments = docs.slice(0, 50);
        this.commentLoading = false;
      }, (err) => {
        console.error("anime_comments listener error", err);
        this.commentLoading = false;
      });
    },

    _unsubscribeAnimeComments() {
      if (this._commentUnsub) {
        try { this._commentUnsub(); } catch (e) {}
        this._commentUnsub = null;
      }
      this.animeComments = [];
    },

    async submitAnimeComment() {
      if (!this.firebaseReady || !this._fbDb || !this.selected) return;
      const nick = this.commentForm.nickname.trim();
      const text = this.commentForm.text.trim();
      if (nick.length < 1 || nick.length > 20) { showToast("暱稱 1-20 字"); return; }
      if (text.length < 5) { showToast("留言至少 5 字"); return; }
      if (text.length > 500) { showToast("留言最多 500 字"); return; }
      const lastSubmit = parseInt(localStorage.getItem("recommendsLastSubmit") || "0", 10);
      const now = Date.now();
      if (now - lastSubmit < 60_000) {
        const wait = Math.ceil((60_000 - (now - lastSubmit)) / 1000);
        showToast(`請稍候 ${wait} 秒再留言`);
        return;
      }
      this.commentSubmitting = true;
      try {
        const audit = await collectAudit();
        const fs = this._fb;
        await fs.addDoc(fs.collection(this._fbDb, "anime_comments"), {
          anime_id: this.selected.id,
          nickname: nick,
          comment: text,
          createdAt: fs.serverTimestamp(),
          audit,
        });
        try { localStorage.setItem("recommendsNickname", nick); } catch (e) {}
        localStorage.setItem("recommendsLastSubmit", String(now));
        this.commentForm.text = "";
        showToast("留言已送出，謝謝！");
      } catch (e) {
        console.error(e);
        showToast("送出失敗：" + (e.message || e));
      } finally {
        this.commentSubmitting = false;
      }
    },
    renderStars(score) {
      if (score == null) return "—";
      return (Math.round(score * 2) / 2).toFixed(1) + "★";
    },
    get displayed() {
      return this.filtered.slice(0, this.displayLimit);
    },
    get hasMore() {
      return this.displayLimit < this.filtered.length;
    },
    loadMore() {
      if (!this.hasMore) return;
      this.displayLimit = Math.min(this.displayLimit + this.pageSize, this.filtered.length);
    },
    _setupInfiniteScroll() {
      if (this._scrollObserver) return;
      const sentinel = this.$refs.loadSentinel;
      if (!sentinel) return;
      this._scrollObserver = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) this.loadMore();
        }
      }, { rootMargin: "800px 0px" });
      this._scrollObserver.observe(sentinel);
    },
    get filtered() {
      let pool = this.all;
      if (this.matchedIds) pool = pool.filter(r => this.matchedIds.has(r.id));
      if (this.activeCats.length) pool = pool.filter(r => this.activeCats.every(c => (r.categories || []).includes(c)));
      if (this.activeTags.length) pool = pool.filter(r => this.activeTags.every(t => (r.tags || []).includes(t)));
      const ms = parseFloat(this.minStars) || 0;
      if (ms > 0) pool = pool.filter(r => (r.rating?.score ?? 0) >= ms);
      if (this.showFavoritesOnly) {
        const favSet = new Set(this.favoritesList);
        pool = pool.filter(r => favSet.has(r.id));
      }
      const sortFn = {
        title: (a, b) => (a.titles.primary_zh || "").localeCompare(b.titles.primary_zh || "", "zh-Hant"),
        year_desc: (a, b) => (b.year || 0) - (a.year || 0),
        year_asc: (a, b) => (a.year || 0) - (b.year || 0),
        score_desc: (a, b) => (b.rating?.score ?? 0) - (a.rating?.score ?? 0),
        self_rating_desc: (a, b) => (b.user?.self_rating_raw ?? 0) - (a.user?.self_rating_raw ?? 0),
      }[this.sortBy];
      return [...pool].sort(sortFn);
    },
  }));

window.Alpine = Alpine;
Alpine.start();
</script>
<script type="module" src="indicator.js?v=1"></script>
</body>
