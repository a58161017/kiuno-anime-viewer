<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>kiuno-anime-viewer</title>
<link rel="stylesheet" href="styles.css?v=3" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body x-data="viewer()" x-cloak x-init="init()">

<header class="header">
  <div class="header__row1">
    <div class="header__title">📺 動漫<small>kiuno</small></div>
    <div class="header__nav">
      <a href="index.html" class="active">卡片</a>
      <a href="graph.html">知識圖</a>
      <a href="recommends.html" class="nav-link-recommends">留言</a>
      <a href="changelog.html" class="version-link nav-link-changelog" x-text="appVersion ? `v${appVersion}` : ''"></a>
    </div>
    <div class="search">
      <input type="search"
             placeholder="搜尋 標題 / 簡介 / tag …"
             x-model="query"
             @input.debounce.150ms="rebuildSearch()"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
    </div>
  </div>

  <div class="header__row2">
    <button class="toggle"
            :aria-pressed="showFavoritesOnly"
            @click="showFavoritesOnly = !showFavoritesOnly">
      <span x-text="showFavoritesOnly ? '♥' : '♡'"></span>
      <span>我的最愛</span>
      <span x-show="favoritesList.length > 0" x-text="`(${favoritesList.length})`" style="opacity:0.7"></span>
    </button>

    <select class="pill-btn" x-model="sortBy" aria-label="排序方式">
      <option value="title">標題</option>
      <option value="year_desc">新→舊</option>
      <option value="year_asc">舊→新</option>
      <option value="score_desc">星級高→低</option>
      <option value="self_rating_desc">自評高→低</option>
    </select>

    <button class="pill-btn" @click="$refs.starsModal.showModal()" :title="`最低星級 ≥ ${minStarsRaw}`">
      ⭐ ≥ <span x-text="minStarsRaw"></span>
    </button>

    <button class="pill-btn" @click="exportFavorites()" :disabled="favoritesList.length === 0" title="匯出我的最愛">⇪</button>
    <button class="pill-btn" @click="$refs.favImport.click()" title="匯入我的最愛">⇩</button>
    <input type="file" accept="application/json,.json" x-ref="favImport" @change="importFavorites($event)" style="display:none" />
    <button class="pill-btn" @click="resetFilters()" title="重設過濾">↻</button>

    <span class="count" x-text="`${filtered.length} / ${all.length}`"></span>
  </div>
</header>

<!-- 最低星級 modal (mobile-friendly) -->
<dialog x-ref="starsModal" style="border:none; border-radius:14px; padding:20px; background:var(--bg-elev); color:var(--fg); min-width:280px;">
  <form method="dialog" style="display:flex; flex-direction:column; gap:12px;">
    <h3 style="margin:0; font-size:16px;">最低星級 ≥ <span x-text="minStarsRaw"></span></h3>
    <input type="range" min="0" max="5" step="0.5"
           :value="minStarsRaw"
           @input="minStarsRaw = $event.target.value; minStars = $event.target.value"
           style="width:100%;" />
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button type="submit" class="pill-btn">關閉</button>
    </div>
  </form>
</dialog>

<!-- 季別新番推薦（owner 手動策劃，由 data/season_picks.json 驅動） -->
<section class="season-bar" x-show="seasonPicks.ids.length > 0" x-cloak>
  <div class="season-bar__header">
    <span class="season-bar__title" x-text="seasonPicks.season_label"></span>
    <span class="count" x-text="`${seasonPicks.ids.length}`"></span>
    <span class="updated" x-show="seasonPicks.updated_at"
          x-text="`更新 ${seasonPicks.updated_at}`"></span>
    <div class="actions">
      <button x-show="seasonPicks.ids.length > seasonDefaultLimit"
              @click="seasonExpanded = !seasonExpanded"
              x-text="seasonExpanded ? '收合' : `+${seasonPicks.ids.length - seasonDefaultLimit}`"></button>
    </div>
  </div>
  <div class="recommend-cards">
    <template x-for="id in (seasonExpanded ? seasonPicks.ids : seasonPicks.ids.slice(0, seasonDefaultLimit))" :key="id">
      <div class="mini-card" @click="selectById(id)" x-show="animeById(id)">
        <div class="cover" :style="`background-image:url('${animeById(id) ? coverFor(animeById(id)) : ''}')`"></div>
        <div class="title" x-text="animeById(id)?.titles?.primary_zh || animeById(id)?.titles?.ja_romaji || id"></div>
      </div>
    </template>
  </div>
</section>

<!-- 推薦清單橫幅 -->
<section class="recommend-bar" x-show="recommendList.length > 0" x-cloak>
  <div class="recommend-bar__header">
    <span class="star-glyph">★</span>
    <span>久野的推薦清單</span>
    <span class="count" x-text="`${recommendList.length}`"></span>
    <div class="actions">
      <button x-show="recommendList.length > 1" @click="reshuffleRecommend()">🔀</button>
      <button x-show="recommendList.length > recommendDefaultLimit" @click="recommendExpanded = !recommendExpanded"
              x-text="recommendExpanded ? '收合' : `+${recommendList.length - recommendDefaultLimit}`"></button>
    </div>
  </div>
  <div class="recommend-cards">
    <template x-for="id in (recommendExpanded ? shuffledRecommend : shuffledRecommend.slice(0, recommendDefaultLimit))" :key="id">
      <div class="mini-card" @click="selectById(id)" x-show="animeById(id)">
        <div class="cover" :style="`background-image:url('${animeById(id) ? coverFor(animeById(id)) : ''}')`"></div>
        <div class="title" x-text="animeById(id)?.titles?.primary_zh || animeById(id)?.titles?.ja_romaji || id"></div>
      </div>
    </template>
  </div>
</section>

<!-- 分類 / 標籤 chips -->
<section class="chips-bar" x-show="topCategories.length > 0 || activeTags.length > 0" x-cloak>
  <template x-for="cat in topCategories" :key="cat">
    <span class="chip"
          :class="{active: activeCats.includes(cat)}"
          @click="toggleCat(cat)" x-text="cat"></span>
  </template>
  <template x-for="tag in activeTags" :key="tag">
    <span class="chip active chip-remove" @click="toggleTag(tag)" x-text="tag"></span>
  </template>
</section>

<!-- Banner: 載入錯誤 / 共享狀態 / 本機模式 -->
<div class="banner" x-show="loadError" x-cloak style="color:var(--review)" x-text="loadError"></div>
<div class="banner shared" x-show="isReadOnlyShared" x-cloak>
  <span>👀 你目前在看分享的推薦清單。點 ★ 後會切到「本機模式」。</span>
</div>
<div class="banner local-mode" x-show="isOwnerMode && !isReadOnlyShared && storageMode === 'local' && recommendList.length > 0" x-cloak>
  <span>💾 推薦清單為本機模式</span>
  <button @click="resetToShared()">重新讀取分享</button>
</div>

<!-- 卡片 grid -->
<main class="cards" :class="{'with-detail': !!selected}">
  <template x-for="rec in displayed" :key="rec.id">
    <div class="card" @click="select(rec)">
      <div class="cover" :style="`background-image:url('${coverFor(rec)}')`">
        <template x-if="isOwnerMode">
          <div class="icon star"
               :class="isRecommended(rec.id) ? 'filled' : 'empty'"
               @click.stop="toggleRecommend(rec.id)"
               :title="isRecommended(rec.id) ? '從推薦移除' : '加入推薦'"
               x-text="isRecommended(rec.id) ? '★' : '☆'"></div>
        </template>
        <div class="icon share"
             @click.stop="shareAnime(rec)"
             title="分享這部動畫"
             x-text="'⇪'"></div>
        <div class="icon heart"
             :class="isFavorite(rec.id) ? 'filled' : 'empty'"
             @click.stop="toggleFavorite(rec.id)"
             :title="isFavorite(rec.id) ? '從我的最愛移除' : '加入我的最愛'"
             x-text="isFavorite(rec.id) ? '♥' : '♡'"></div>
      </div>
      <div class="info">
        <div class="title" x-text="rec.titles.primary_zh || rec.titles.ja_romaji || rec.id"></div>
        <div class="meta">
          <span x-text="rec.year || '?'"></span>
          <span class="stars" x-text="renderStars(rec.rating?.score)"></span>
        </div>
      </div>
    </div>
  </template>
  <div class="empty" x-show="filtered.length === 0 && !loadError">沒有符合的動畫</div>
</main>
<div class="load-sentinel" x-ref="loadSentinel" x-show="hasMore" x-cloak>
  <span class="load-sentinel__hint" x-text="`載入更多… (${displayed.length} / ${filtered.length})`"></span>
</div>

<!-- 詳情 drawer (mobile = bottom; desktop = right side panel) -->
<div class="drawer-backdrop" :class="{open: !!selected}" @click="close()"></div>
<aside class="drawer" :class="{open: !!selected}" role="dialog" aria-modal="true">
  <div class="drawer__handle" @click="close()"></div>
  <button class="drawer__close" @click="close()" aria-label="關閉">×</button>
  <div class="drawer__body">
    <template x-if="selected">
      <div>
        <img class="detail__cover"
             :src="coverFor(selected)"
             :alt="selected.titles.primary_zh"
             onerror="this.style.display='none'" />
        <div class="detail__content">
          <h2 class="detail__name" x-text="selected.titles.primary_zh || selected.titles.ja_romaji"></h2>
          <div class="detail__alias">
            <div x-show="selected.titles.ja" x-text="selected.titles.ja"></div>
            <div x-show="selected.titles.ja_romaji" x-text="selected.titles.ja_romaji"></div>
            <div x-show="selected.titles.en" x-text="selected.titles.en"></div>
          </div>

          <div class="detail__meta">
            <span x-show="selected.year"><span x-text="selected.year"></span> 年</span>
            <span x-show="selected.season" x-text="selected.season"></span>
            <span x-show="selected.episodes"><span x-text="selected.episodes"></span> 集</span>
            <span x-show="selected.format" x-text="selected.format"></span>
            <span x-show="selected.studios?.length" x-text="selected.studios.join(' · ')"></span>
          </div>

          <div class="detail__rating">
            <div class="row main">
              <span>客觀星級</span>
              <span class="stars" x-text="renderStars(selected.rating?.score)"></span>
            </div>
            <template x-for="[k, v] in Object.entries(selected.rating?.sources || {})" :key="k">
              <div class="row">
                <span x-text="k"></span>
                <span x-text="`${v.score} / ${v.scale}`"></span>
              </div>
            </template>
            <div class="row self" x-show="selected.user?.self_rating_raw != null">
              <span>使用者自評</span>
              <span x-text="selected.user.self_rating_raw + ' 星'"></span>
            </div>
          </div>

          <div class="detail__synopsis"
               x-text="selected.synopsis_zh || '(Bangumi 暫無中文簡介，可在 data/manual_overrides.json 自行補上)'"></div>

          <div class="detail__section" x-show="selected.categories?.length">
            <div class="detail__label">分類</div>
            <div class="detail__chips">
              <template x-for="c in selected.categories || []" :key="c">
                <span class="chip" @click="toggleCat(c); close()" x-text="c"></span>
              </template>
            </div>
          </div>

          <div class="detail__section" x-show="selected.tags?.length">
            <div class="detail__label">標籤</div>
            <div class="detail__chips">
              <template x-for="t in selected.tags || []" :key="t">
                <span class="chip" @click="toggleTag(t); close()" x-text="t"></span>
              </template>
            </div>
          </div>

          <div class="detail__links" x-show="Object.keys(selected.external_links || {}).length">
            <template x-for="[k, url] in Object.entries(selected.external_links || {})" :key="k">
              <a :href="url" target="_blank" rel="noopener" x-text="k"></a>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</aside>

<!-- Toast -->
<div class="toast" id="globalToast"></div>

<script>
function viewer() {
  return {
    all: [],
    byId: {},
    selected: null,
    query: "",
    sortBy: "title",
    minStars: 0,
    minStarsRaw: 0,
    activeCats: [],
    activeTags: [],
    fuse: null,
    matchedIds: null,
    loadError: "",
    topCategories: [],
    recommendList: [],
    shuffledRecommend: [],
    seasonPicks: { season_label: "", ids: [], updated_at: "" },
    seasonExpanded: false,
    favoritesList: [],
    showFavoritesOnly: false,
    recommendExpanded: false,
    isOwnerMode: false,
    storageMode: "host",
    isReadOnlyShared: false,
    viewportWidth: window.innerWidth,
    appVersion: "",
    pageSize: 40,
    displayLimit: 40,
    _scrollObserver: null,

    async init() {
      const h = location.hostname;
      const params0 = new URLSearchParams(location.search);
      this.isOwnerMode = (h === '127.0.0.1' || h === 'localhost' || h === '' ||
                          params0.get('owner') === '1');

      // 版本號 (顯示在 header)
      try {
        const vr = await fetch("data/version.json", { cache: "no-cache" });
        if (vr.ok) { const v = await vr.json(); this.appVersion = v.current || ""; }
      } catch (e) {}

      await this.loadUserState();
      try {
        const resp = await fetch("data/anime.json", { cache: "no-cache" });
        if (!resp.ok) throw new Error(resp.status + " " + resp.statusText);
        const db = await resp.json();
        this.all = Object.values(db.anime || {});
        this.byId = db.anime || {};
        this.computeTopCategories();
        this.rebuildSearch();
        const before = this.recommendList.length + this.favoritesList.length;
        this.recommendList = this.recommendList.filter(id => this.byId[id]);
        this.favoritesList = this.favoritesList.filter(id => this.byId[id]);
        const after = this.recommendList.length + this.favoritesList.length;
        if (before !== after) { this.persistRecommend(); this.persistFavorites(); }
        this.reshuffleRecommend();

        // 季別新番推薦（owner 編輯 data/season_picks.json 換季更新）
        try {
          const r = await fetch("data/season_picks.json", { cache: "no-cache" });
          if (r.ok) {
            const d = await r.json();
            if (d && Array.isArray(d.ids)) {
              this.seasonPicks = {
                season_label: d.season_label || "當季推薦",
                ids: d.ids.filter(id => this.byId[id]),
                updated_at: d.updated_at || "",
              };
            }
          }
        } catch (e) { /* 沒檔案就不顯示 */ }

        const targetId = params0.get('id');
        if (targetId && this.byId[targetId]) this.select(this.byId[targetId]);

        // 過濾/排序變動 → 回到第一頁
        const resetPaging = () => { this.displayLimit = this.pageSize; };
        this.$watch('query', resetPaging);
        this.$watch('sortBy', resetPaging);
        this.$watch('minStars', resetPaging);
        this.$watch('showFavoritesOnly', resetPaging);
        this.$watch('activeCats', resetPaging);
        this.$watch('activeTags', resetPaging);

        // 接近底部 → 載下一批
        this.$nextTick(() => this._setupInfiniteScroll());

        // ESC closes drawer
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && this.selected) this.close();
        });
        // viewport reactive (recommend bar mobile/desktop count switch)
        window.addEventListener('resize', () => { this.viewportWidth = window.innerWidth; });
      } catch (e) {
        this.loadError = "讀取 anime.json 失敗：" + e.message + "（請先跑 python run.py enrich）";
      }
    },

    async loadUserState() {
      try {
        this.favoritesList = JSON.parse(localStorage.getItem('animeViewer.favorites') || '[]');
      } catch (e) { this.favoritesList = []; }

      const hasLocalRecommendEdits = localStorage.getItem('animeViewer.recommendEdited') === '1';
      let localRecommend = [];
      try {
        localRecommend = JSON.parse(localStorage.getItem('animeViewer.recommend') || '[]');
      } catch (e) {}

      let fileRecommend = null;
      try {
        const r = await fetch("data/user_lists.json", { cache: "no-store" });
        if (r.ok) {
          const d = await r.json();
          if (d && typeof d === "object" && Array.isArray(d.recommend)) {
            fileRecommend = d.recommend.slice();
          }
        }
      } catch (e) {}

      if (hasLocalRecommendEdits) {
        this.recommendList = localRecommend;
        this.isReadOnlyShared = false;
        if (this.isOwnerMode && localRecommend.length > 0) {
          this._syncRecommendToFile(localRecommend);
        }
      } else if (fileRecommend && fileRecommend.length) {
        this.recommendList = fileRecommend;
        this.isReadOnlyShared = true;
      } else {
        this.recommendList = localRecommend;
        this.isReadOnlyShared = false;
      }
    },

    _syncRecommendToFile(list) {
      fetch("api/user_lists", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recommend: list }),
      }).then(r => {
        if (r.ok) {
          this.storageMode = "host";
          localStorage.removeItem('animeViewer.recommendEdited');
        }
      }).catch(() => {});
    },

    persistRecommend() {
      try {
        localStorage.setItem('animeViewer.recommend', JSON.stringify(this.recommendList));
        localStorage.setItem('animeViewer.recommendEdited', '1');
      } catch (e) {}
      this.isReadOnlyShared = false;
      fetch("api/user_lists", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ recommend: this.recommendList }),
      }).then(r => {
        if (r.ok) {
          this.storageMode = "host";
          localStorage.removeItem('animeViewer.recommendEdited');
        } else {
          this.storageMode = "local";
        }
      }).catch(() => { this.storageMode = "local"; });
    },

    persistFavorites() {
      try { localStorage.setItem('animeViewer.favorites', JSON.stringify(this.favoritesList)); } catch (e) {}
    },

    resetToShared() {
      if (!confirm('放棄本機推薦清單編輯，重新從分享檔案讀取？\n（我的最愛不受影響）')) return;
      localStorage.removeItem('animeViewer.recommendEdited');
      localStorage.removeItem('animeViewer.recommend');
      location.reload();
    },

    exportFavorites() {
      if (this.favoritesList.length === 0) return;
      const data = {
        version: 1,
        favorites: this.favoritesList,
        exported_at: new Date().toISOString(),
        titles: this.favoritesList.map(id => {
          const r = this.byId[id];
          return { id, title: r ? (r.titles.primary_zh || r.titles.ja_romaji) : id };
        }),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url; a.download = `my_favorites_${dateStr}.json`; a.click();
      URL.revokeObjectURL(url);
      this.showToast(`已匯出 ${this.favoritesList.length} 部最愛`);
    },

    async importFavorites(event) {
      const file = event.target.files[0];
      if (!file) return;
      const text = await file.text();
      event.target.value = '';
      try {
        const d = JSON.parse(text);
        if (!Array.isArray(d.favorites)) throw new Error('JSON 沒有 favorites 陣列');
        const valid = d.favorites.filter(id => this.byId[id]);
        const invalid = d.favorites.length - valid.length;
        const choice = confirm(
          `匯入 ${valid.length} 部最愛${invalid ? `（${invalid} 部找不到動畫被略過）` : ''}\n\n` +
          `按「確定」= 合併\n按「取消」= 取代`
        );
        if (choice) {
          const set = new Set(this.favoritesList);
          for (const id of valid) set.add(id);
          this.favoritesList = Array.from(set);
        } else {
          this.favoritesList = valid;
        }
        this.persistFavorites();
        this.showToast(`匯入完成 → ${this.favoritesList.length} 部`);
      } catch (e) {
        alert('匯入失敗：' + e.message);
      }
    },

    async shareAnime(rec) {
      const url = new URL(location.href);
      url.searchParams.set('id', rec.id);
      url.hash = '';
      const shareUrl = url.toString();
      const title = rec.titles.primary_zh || rec.titles.ja_romaji || '動畫';
      const score = rec.rating?.score != null ? `${rec.rating.score.toFixed(1)} ★` : '';
      const summary = (rec.synopsis_zh || '').slice(0, 200);
      const text = [
        `《${title}》${rec.year ? '(' + rec.year + ')' : ''}`,
        score && `評分：${score}`,
        summary && `\n${summary}${rec.synopsis_zh && rec.synopsis_zh.length > 200 ? '...' : ''}`,
      ].filter(Boolean).join('\n');

      if (navigator.share) {
        try { await navigator.share({ title, text, url: shareUrl }); return; }
        catch (e) {}
      }
      const fullText = `${text}\n\n${shareUrl}`;
      try {
        await navigator.clipboard.writeText(fullText);
        this.showToast('已複製分享內容');
      } catch (e) {
        prompt('複製以下內容分享：', fullText);
      }
    },

    showToast(msg, ms = 1800) {
      const el = document.getElementById('globalToast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    },

    get recommendDefaultLimit() {
      return this.viewportWidth >= 600 ? 10 : 5;
    },
    get seasonDefaultLimit() {
      return this.viewportWidth >= 600 ? 10 : 5;
    },
    isRecommended(id) { return this.recommendList.includes(id); },
    isFavorite(id) { return this.favoritesList.includes(id); },
    toggleRecommend(id) {
      if (!this.isOwnerMode) return;
      const i = this.recommendList.indexOf(id);
      if (i >= 0) this.recommendList.splice(i, 1);
      else this.recommendList.unshift(id);
      this.persistRecommend();
      this.reshuffleRecommend();
    },
    reshuffleRecommend() {
      const a = this.recommendList.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      this.shuffledRecommend = a;
    },
    toggleFavorite(id) {
      const i = this.favoritesList.indexOf(id);
      if (i >= 0) this.favoritesList.splice(i, 1);
      else this.favoritesList.push(id);
      this.persistFavorites();
    },
    animeById(id) { return this.byId[id]; },
    selectById(id) {
      const rec = this.byId[id];
      if (rec) this.select(rec);
    },
    computeTopCategories() {
      const counts = {};
      for (const r of this.all) for (const c of (r.categories || [])) counts[c] = (counts[c] || 0) + 1;
      this.topCategories = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 14).map(x => x[0]);
    },
    rebuildSearch() {
      this.fuse = new Fuse(this.all, {
        keys: [
          { name: "titles.primary_zh", weight: 3 },
          { name: "titles.ja_romaji", weight: 2 },
          { name: "titles.ja", weight: 2 },
          { name: "titles.en", weight: 2 },
          { name: "synopsis_zh", weight: 1 },
          { name: "tags", weight: 2 },
          { name: "categories", weight: 2 },
          { name: "studios", weight: 1.5 },
          { name: "source_doc_raw", weight: 0.5 },
        ],
        threshold: 0.4,
        ignoreLocation: true,
      });
      if (this.query.trim()) {
        this.matchedIds = new Set(this.fuse.search(this.query).map(r => r.item.id));
      } else {
        this.matchedIds = null;
      }
    },
    toggleCat(c) {
      const i = this.activeCats.indexOf(c);
      if (i >= 0) this.activeCats.splice(i, 1); else this.activeCats.push(c);
    },
    toggleTag(t) {
      const i = this.activeTags.indexOf(t);
      if (i >= 0) this.activeTags.splice(i, 1); else this.activeTags.push(t);
    },
    resetFilters() {
      this.query = ""; this.activeCats = []; this.activeTags = [];
      this.minStars = 0; this.minStarsRaw = 0;
      this.matchedIds = null;
      this.showFavoritesOnly = false;
    },
    select(rec) {
      this.selected = rec;
      this.$nextTick(() => {
        const body = document.querySelector('.drawer__body');
        if (body) body.scrollTop = 0;
      });
    },
    close() { this.selected = null; },
    coverFor(rec) {
      const c = rec.cover || {};
      return c.local || c.url || "";
    },
    renderStars(score) {
      if (score == null) return "—";
      return (Math.round(score * 2) / 2).toFixed(1) + "★";
    },
    get displayed() {
      return this.filtered.slice(0, this.displayLimit);
    },
    get hasMore() {
      return this.displayLimit < this.filtered.length;
    },
    loadMore() {
      if (!this.hasMore) return;
      this.displayLimit = Math.min(this.displayLimit + this.pageSize, this.filtered.length);
    },
    _setupInfiniteScroll() {
      if (this._scrollObserver) return;
      const sentinel = this.$refs.loadSentinel;
      if (!sentinel) return;
      this._scrollObserver = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) this.loadMore();
        }
      }, { rootMargin: "800px 0px" });
      this._scrollObserver.observe(sentinel);
    },
    get filtered() {
      let pool = this.all;
      if (this.matchedIds) pool = pool.filter(r => this.matchedIds.has(r.id));
      if (this.activeCats.length) pool = pool.filter(r => this.activeCats.every(c => (r.categories || []).includes(c)));
      if (this.activeTags.length) pool = pool.filter(r => this.activeTags.every(t => (r.tags || []).includes(t)));
      const ms = parseFloat(this.minStars) || 0;
      if (ms > 0) pool = pool.filter(r => (r.rating?.score ?? 0) >= ms);
      if (this.showFavoritesOnly) {
        const favSet = new Set(this.favoritesList);
        pool = pool.filter(r => favSet.has(r.id));
      }
      const sortFn = {
        title: (a, b) => (a.titles.primary_zh || "").localeCompare(b.titles.primary_zh || "", "zh-Hant"),
        year_desc: (a, b) => (b.year || 0) - (a.year || 0),
        year_asc: (a, b) => (a.year || 0) - (b.year || 0),
        score_desc: (a, b) => (b.rating?.score ?? 0) - (a.rating?.score ?? 0),
        self_rating_desc: (a, b) => (b.user?.self_rating_raw ?? 0) - (a.user?.self_rating_raw ?? 0),
      }[this.sortBy];
      return [...pool].sort(sortFn);
    },
  };
}
</script>
