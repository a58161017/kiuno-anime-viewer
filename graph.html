<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <title>kiuno-anime-viewer · 知識圖</title>
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23818CF8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='5' r='3'/%3E%3Ccircle cx='5' cy='19' r='3'/%3E%3Ccircle cx='19' cy='19' r='3'/%3E%3Cline x1='12' y1='8' x2='5' y2='16'/%3E%3Cline x1='12' y1='8' x2='19' y2='16'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <style>
    body, html { background: var(--bg); overscroll-behavior: none; }
    #cy {
      width: 100%; height: calc(100vh - 110px);
      background: radial-gradient(ellipse at 50% 40%, rgba(129,140,248,0.08), var(--bg) 65%);
      touch-action: none;
    }
    .graph-controls {
      display: flex; gap: var(--space-2); align-items: center;
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.85); backdrop-filter: blur(12px) saturate(180%);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .graph-controls::-webkit-scrollbar { display: none; }
    .breadcrumb {
      display: flex; gap: var(--space-1); align-items: center; flex: 1; min-width: 0;
      flex-wrap: nowrap;
    }
    .breadcrumb .crumb {
      cursor: pointer;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      font: 500 var(--fs-body-sm) var(--font-body);
      white-space: nowrap;
      flex: 0 0 auto;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--dur-fast) var(--ease-out),
                  border-color var(--dur-fast) var(--ease-out),
                  color var(--dur-fast) var(--ease-out);
    }
    .breadcrumb .crumb:hover { background: var(--bg-elev-2); color: var(--fg); border-color: var(--border-strong); }
    .breadcrumb .crumb.current {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      cursor: default;
      font-weight: 600;
    }
    .breadcrumb .sep { color: var(--fg-faint); flex: 0 0 auto; }

    .graph-controls button.fit {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: var(--radius-sm);
      font: 500 var(--fs-body-sm) var(--font-body);
      white-space: nowrap;
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }
    .graph-controls button.fit:hover { background: var(--bg-elev-2); border-color: var(--border-strong); }
    .graph-controls button.fit:focus-visible {
      outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
    }

    /* Mobile: node-info 改成底部 sheet (對齊 drawer token) */
    #node-info {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 70vh;
      background: var(--bg-elev);
      border-top: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: var(--space-4);
      display: none;
      overflow-y: auto;
      font: 400 var(--fs-body-sm) var(--font-body);
      box-shadow: var(--shadow-xl);
      padding-bottom: max(var(--space-4), env(safe-area-inset-bottom));
      z-index: 60;
    }
    #node-info img {
      width: 100%; max-height: 220px;
      object-fit: contain;
      background: var(--bg-sunken);
      border-radius: var(--radius-md);
    }
    #node-info h3 {
      margin: var(--space-3) 0 var(--space-1);
      font: 700 var(--fs-h2) var(--font-display);
      letter-spacing: -0.01em;
    }
    #node-info .close {
      position: absolute; right: var(--space-2); top: var(--space-2);
      width: 40px; height: 40px;
      display: grid; place-items: center;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--fg-muted);
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background var(--dur-fast) var(--ease-out),
                  border-color var(--dur-fast) var(--ease-out),
                  color var(--dur-fast) var(--ease-out);
    }
    #node-info .close:hover { background: var(--bg-elev); border-color: var(--border-strong); color: var(--fg); }

    /* Desktop: side panel */
    @media (min-width: 900px) {
      #node-info {
        left: auto; bottom: auto;
        right: var(--space-3); top: 130px;
        width: 360px; max-height: 75vh;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
      }
    }

    .level-banner {
      background: var(--bg-elev);
      border-left: 3px solid var(--accent);
      border-bottom: 1px solid var(--border);
      color: var(--fg-muted);
      font: 400 var(--fs-body-sm)/1.55 var(--font-body);
      padding: var(--space-3) var(--space-4);
      display: none;
    }
    .level-banner.show { display: block; }
    .level-banner b { color: var(--accent); font-weight: 700; }

    /* level-toast 用 styles.css 全域 .toast 樣式即可，這頁的 inline override 拿掉 */
    .level-toast {
      position: fixed; left: 50%; top: max(80px, env(safe-area-inset-top));
      transform: translate(-50%, -8px);
      background: var(--bg-elev-2);
      border: 1px solid var(--accent);
      color: var(--fg);
      padding: var(--space-3) var(--space-5);
      border-radius: var(--radius-pill);
      font: 600 var(--fs-body-sm) var(--font-body);
      box-shadow: var(--shadow-lg), 0 0 24px var(--accent-soft);
      pointer-events: none; opacity: 0;
      transition: opacity var(--dur-base) var(--ease-out),
                  transform var(--dur-base) var(--ease-out);
      z-index: 100;
    }
    .level-toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

<header class="header">
  <div class="header__row1">
    <div class="header__title">
      <svg class="i i--lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><line x1="12" y1="8" x2="5" y2="16"/><line x1="12" y1="8" x2="19" y2="16"/></svg>
      知識圖<small>kiuno</small>
    </div>
    <div class="header__nav">
      <a href="index.html">卡片</a>
      <a href="graph.html" class="active">知識圖</a>
      <a href="recommends.html" class="nav-link-recommends">留言</a>
      <a href="ritual.html?src=all" class="nav-link-ritual">召喚陣</a>
      <a href="changelog.html" class="version-link nav-link-changelog" id="versionLink"></a>
    </div>
    <span class="count" id="counts" style="margin-left:auto;"></span>
  </div>
</header>

<div class="graph-controls">
  <div class="breadcrumb" id="breadcrumb"></div>
  <button class="fit" onclick="cy && cy.fit(null, 60)" aria-label="置中" title="置中">
    <svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    <span>置中</span>
  </button>
</div>

<div class="level-banner" id="levelBanner"></div>

<div id="cy"></div>
<div id="node-info"></div>
<div class="level-toast" id="toast"></div>

<script>
let anime = {};
let graphAll = null;
let cy = null;
let level = 0;
let path = { category: null, tag: null };

const DERIVED_TAG_PREFIXES = ['年份-', 'studio-', 'format-', '星級-'];
const SECTION_TAGS = new Set(['劇場版', '季番', '已完結']);

// Track zoom for drill detection
let zoomCheckTimer = null;
let lastDrillTime = 0;
const ZOOM_DRILL_COOLDOWN = 1500;  // ms between drills
const ZOOM_IN_RATIO = 2.6;          // current/initial zoom > this → drill in
const ZOOM_OUT_RATIO = 0.45;        // current/initial < this → drill out

let initialZoomForLevel = 1;

async function load() {
  // 版本號顯示
  try {
    const vr = await fetch('data/version.json', { cache: 'no-cache' });
    if (vr.ok) {
      const v = await vr.json();
      const link = document.getElementById('versionLink');
      if (link && v.current) link.textContent = 'v' + v.current;
    }
  } catch (e) {}

  const [aR, gR] = await Promise.all([
    fetch('data/anime.json', { cache: 'no-cache' }),
    fetch('data/graph.json', { cache: 'no-cache' }),
  ]);
  anime = (await aR.json()).anime || {};
  graphAll = await gR.json();
  document.getElementById('counts').textContent =
    `${Object.keys(anime).length} 部動畫 · ${graphAll.edges.length} 邊`;
  initCytoscape();
  renderLevel0();
}

function initCytoscape() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    minZoom: 0.05, maxZoom: 6,
    wheelSensitivity: 0.3,
    style: [
      // ---- category (indigo accent — 主分類用主色) ----
      {
        selector: 'node[type = "category"]',
        style: {
          'background-color': '#6366F1',      // accent-strong
          'background-fit': 'cover',
          'background-opacity': 0.95,
          'background-blacken': -0.05,
          'label': 'data(label)',
          'color': '#F1F5F9',
          'font-size': 16, 'font-weight': 'bold',
          'text-halign': 'center', 'text-valign': 'center',
          'text-wrap': 'wrap', 'text-max-width': 100,
          'text-outline-color': '#0F172A', 'text-outline-width': 2,
          'width': ele => 70 + Math.sqrt(ele.data('count')) * 8,
          'height': ele => 70 + Math.sqrt(ele.data('count')) * 8,
          'border-width': 3,
          'border-color': '#A5B4FC',          // accent-hover
          'border-opacity': 0.85,
          'shadow-blur': 32,
          'shadow-color': '#818CF8',          // accent
          'shadow-opacity': 0.55,
          'shadow-offset-x': 0, 'shadow-offset-y': 0,
        },
      },
      // ---- tag (violet — 次要層級用紫色) ----
      {
        selector: 'node[type = "tag"]',
        style: {
          'background-color': '#A78BFA',      // violet
          'background-opacity': 0.95,
          'label': 'data(label)',
          'color': '#0F172A',
          'font-size': 12, 'font-weight': 'bold',
          'text-halign': 'center', 'text-valign': 'center',
          'text-wrap': 'wrap', 'text-max-width': 80,
          'width': ele => 44 + Math.sqrt(ele.data('count')) * 6,
          'height': ele => 44 + Math.sqrt(ele.data('count')) * 6,
          'border-width': 2.5,
          'border-color': '#C4B5FD',
          'shadow-blur': 22,
          'shadow-color': '#A78BFA',
          'shadow-opacity': 0.5,
          'shadow-offset-x': 0, 'shadow-offset-y': 0,
        },
      },
      // ---- anime (cover image foreground, score-tinted border) ----
      {
        selector: 'node[type = "anime"]',
        style: {
          'background-color': '#192134',      // bg-elev fallback while image loads
          'background-image': 'data(cover)',
          'background-fit': 'cover cover',
          'label': 'data(label)',
          'color': '#F1F5F9',
          'font-size': 9,
          'text-outline-color': '#0F172A',
          'text-outline-width': 2,
          'text-valign': 'bottom',
          'text-margin-y': 6,
          'text-wrap': 'wrap', 'text-max-width': 100,
          'width': ele => 36 + (ele.data('score') || 0) * 5,
          'height': ele => 36 + (ele.data('score') || 0) * 5,
          'border-width': 2,
          'border-color': ele => {
            const s = ele.data('score') || 0;
            if (s >= 4.5) return '#FCD34D';   // star (gold) — 高分
            if (s >= 4.0) return '#818CF8';   // accent indigo — 中高分
            return '#475569';                  // slate — 一般
          },
          'shadow-blur': 14,
          'shadow-color': '#000',
          'shadow-opacity': 0.5,
        },
      },
      { selector: 'node.hover', style: { 'border-width': 5, 'border-color': '#FCD34D', 'z-compound-depth': 'top' } },
      { selector: 'node.dim', style: { opacity: 0.18 } },

      // ---- edges ----
      {
        selector: 'edge[etype = "category-link"]',
        style: {
          'line-color': '#818CF8', 'opacity': 'data(opacity)',     // accent indigo
          'width': ele => 1 + Math.sqrt(ele.data('weight') || 1),
          'curve-style': 'haystack',
        },
      },
      {
        selector: 'edge[etype = "tag-link"]',
        style: {
          'line-color': '#A78BFA', 'opacity': 'data(opacity)',     // violet
          'width': ele => 1 + Math.sqrt(ele.data('weight') || 1) * 0.7,
          'curve-style': 'haystack',
        },
      },
      { selector: 'edge[etype = "franchise"]', style: { 'line-color': '#FB7185', 'width': 2.5, 'target-arrow-color': '#FB7185', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'opacity': 0.9 } },  // heart pink — 系列關係保留暖色暗示
      { selector: 'edge[etype = "same_studio"]', style: { 'line-color': '#818CF8', 'width': 1, 'opacity': 0.45, 'curve-style': 'haystack' } },
      { selector: 'edge[etype = "shared_tag"]', style: { 'line-color': '#A78BFA', 'width': 1, 'opacity': 0.35, 'curve-style': 'haystack' } },
      { selector: 'edge.dim', style: { 'opacity': 0.05 } },
    ],
  });

  cy.on('tap', 'node', evt => onNodeTap(evt.target));

  // Stable hover: 快速經過多節點時不閃爍。把「移除 dim/hover」延後 220ms，
  // 在期間進入新節點 → 直接 swap，避免閃黑→白的閃爍。
  let hoveredNode = null;
  let hoverClearTimer = null;
  cy.on('mouseover', 'node', evt => {
    if (hoverClearTimer) { clearTimeout(hoverClearTimer); hoverClearTimer = null; }
    const n = evt.target;
    if (hoveredNode === n) return;
    if (hoveredNode) hoveredNode.removeClass('hover');
    n.addClass('hover');
    hoveredNode = n;
    if (level === 2) {
      const nbr = n.neighborhood().add(n);
      cy.elements().removeClass('dim');
      cy.elements().not(nbr).addClass('dim');
    }
  });
  cy.on('mouseout', 'node', () => {
    if (hoverClearTimer) clearTimeout(hoverClearTimer);
    hoverClearTimer = setTimeout(() => {
      if (hoveredNode) { hoveredNode.removeClass('hover'); hoveredNode = null; }
      cy.elements().removeClass('dim');
      hoverClearTimer = null;
    }, 220);
  });

  cy.on('tap', evt => { if (evt.target === cy) hideInfo(); });

  // Zoom-based drill
  cy.on('zoom', () => {
    if (zoomCheckTimer) clearTimeout(zoomCheckTimer);
    zoomCheckTimer = setTimeout(checkZoomDrill, 250);  // settle 250ms before testing
  });
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1300);
}

function setBanner(html) {
  const b = document.getElementById('levelBanner');
  if (!b) return;
  if (html) { b.innerHTML = html; b.classList.add('show'); }
  else { b.innerHTML = ''; b.classList.remove('show'); }
}

function checkZoomDrill() {
  const now = Date.now();
  if (now - lastDrillTime < ZOOM_DRILL_COOLDOWN) return;
  const z = cy.zoom();
  const ratio = z / initialZoomForLevel;

  if (ratio > ZOOM_IN_RATIO && level < 2) {
    // Find the node nearest to viewport center
    const cx = cy.width() / 2, cy_ = cy.height() / 2;
    let best = null, bestD = Infinity;
    cy.nodes().forEach(n => {
      const p = n.renderedPosition();
      const d = (p.x - cx) ** 2 + (p.y - cy_) ** 2;
      if (d < bestD) { bestD = d; best = n; }
    });
    if (best) {
      lastDrillTime = now;
      onNodeTap(best);
    }
  } else if (ratio < ZOOM_OUT_RATIO && level > 0) {
    lastDrillTime = now;
    if (level === 1) drillTo(0, {});
    else if (level === 2) drillTo(1, { category: path.category });
  }
}

function onNodeTap(node) {
  const t = node.data('type');
  if (t === 'category') drillTo(1, { category: node.data('cat') });
  else if (t === 'tag') drillTo(2, { category: path.category, tag: node.data('tag') });
  else if (t === 'anime') showAnimeInfo(node);
}

function drillTo(newLevel, newPath) {
  level = newLevel;
  path = { category: newPath.category || null, tag: newPath.tag || null };
  hideInfo();
  if (level === 0) { showToast('返回所有分類'); renderLevel0(); }
  else if (level === 1) { showToast(`進入分類：${path.category}`); renderLevel1(path.category); }
  else if (level === 2) { showToast(`進入標籤：${path.tag}`); renderLevel2(path.category, path.tag); }
  renderBreadcrumb();
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  const parts = [];
  parts.push(`<span class="crumb${level === 0 ? ' current' : ''}" data-l="0">所有分類</span>`);
  if (path.category) {
    parts.push('<span class="sep">›</span>');
    parts.push(`<span class="crumb${level === 1 ? ' current' : ''}" data-l="1" data-cat="${path.category}">${escapeHtml(path.category)}</span>`);
  }
  if (path.tag) {
    parts.push('<span class="sep">›</span>');
    parts.push(`<span class="crumb${level === 2 ? ' current' : ''}" data-l="2">${escapeHtml(path.tag)}</span>`);
  }
  bc.innerHTML = parts.join('');
  bc.querySelectorAll('.crumb').forEach(el => {
    el.addEventListener('click', () => {
      const l = parseInt(el.dataset.l, 10);
      if (l === 0) drillTo(0, {});
      else if (l === 1) drillTo(1, { category: el.dataset.cat });
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============== LEVEL 0: CATEGORIES ==============
function renderLevel0() {
  setBanner('');
  const counts = {};
  Object.values(anime).forEach(rec => (rec.categories || []).forEach(c => counts[c] = (counts[c] || 0) + 1));
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

  const nodes = cats.map(cat => ({
    data: { id: 'cat:' + cat, label: `${cat}\n(${counts[cat]})`, count: counts[cat], cat, type: 'category' }
  }));

  // Edges = pairs of categories sharing >= 5 anime; weight = #shared
  const edges = [];
  const idxOf = {};
  cats.forEach((c, i) => idxOf[c] = i);
  for (let i = 0; i < cats.length; i++) {
    for (let j = i + 1; j < cats.length; j++) {
      let shared = 0;
      Object.values(anime).forEach(rec => {
        const cs = rec.categories || [];
        if (cs.includes(cats[i]) && cs.includes(cats[j])) shared++;
      });
      if (shared >= 5) {
        edges.push({
          data: {
            id: `e_cat_${i}_${j}`,
            source: 'cat:' + cats[i], target: 'cat:' + cats[j],
            etype: 'category-link', weight: shared,
            opacity: Math.min(0.7, 0.15 + shared / 200),
          }
        });
      }
    }
  }

  cy.elements().remove();
  cy.add(nodes); cy.add(edges);
  cy.layout({
    name: 'fcose', quality: 'proof', animate: true, animationDuration: 500,
    randomize: true, nodeRepulsion: 9000, idealEdgeLength: 220,
    edgeElasticity: 0.4, gravity: 0.25, padding: 50,
  }).run();
  cy.one('layoutstop', () => { initialZoomForLevel = cy.zoom(); });
}

// ============== LEVEL 1: TAGS WITHIN CATEGORY ==============
function renderLevel1(cat) {
  const recsInCat = Object.values(anime).filter(rec => (rec.categories || []).includes(cat));
  setBanner(`顯示 <b>${escapeHtml(cat)}</b> 分類底下 ${recsInCat.length} 部動漫匯總出來的標籤`);
  const tagCounts = {};
  recsInCat.forEach(rec => {
    (rec.tags || []).forEach(t => {
      if (DERIVED_TAG_PREFIXES.some(p => t.startsWith(p))) return;
      if (SECTION_TAGS.has(t)) return;
      tagCounts[t] = (tagCounts[t] || 0) + 1;
    });
  });
  const sortedTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 50);

  const nodes = sortedTags.map(([tag, n]) => ({
    data: { id: 'tag:' + tag, label: `${tag}\n(${n})`, count: n, tag, type: 'tag' }
  }));

  // Edges = tag pairs co-occurring in >= max(2, total/30) anime
  const tagSet = new Set(sortedTags.map(([t]) => t));
  const edges = [];
  const minCo = Math.max(2, Math.floor(recsInCat.length / 30));
  for (let i = 0; i < sortedTags.length; i++) {
    const t1 = sortedTags[i][0];
    for (let j = i + 1; j < sortedTags.length; j++) {
      const t2 = sortedTags[j][0];
      let co = 0;
      recsInCat.forEach(rec => {
        if ((rec.tags || []).includes(t1) && (rec.tags || []).includes(t2)) co++;
      });
      if (co >= minCo) {
        edges.push({
          data: {
            id: `e_tag_${i}_${j}`,
            source: 'tag:' + t1, target: 'tag:' + t2,
            etype: 'tag-link', weight: co,
            opacity: Math.min(0.5, 0.1 + co / 50),
          }
        });
      }
    }
  }

  cy.elements().remove();
  cy.add(nodes); cy.add(edges);
  cy.layout({
    name: 'fcose', quality: 'proof', animate: true, animationDuration: 500,
    randomize: true, nodeRepulsion: 7000, idealEdgeLength: 140,
    edgeElasticity: 0.3, gravity: 0.3, padding: 40,
  }).run();
  cy.one('layoutstop', () => { initialZoomForLevel = cy.zoom(); });
}

// ============== LEVEL 2: ANIME WITHIN TAG ==============
function renderLevel2(cat, tag) {
  const matched = [];
  for (const [id, rec] of Object.entries(anime)) {
    if (!(rec.categories || []).includes(cat)) continue;
    if (!(rec.tags || []).includes(tag)) continue;
    matched.push([id, rec]);
  }
  setBanner(`<b>${escapeHtml(cat)}</b> · <b>${escapeHtml(tag)}</b> · ${matched.length} 部動漫`);
  const idSet = new Set(matched.map(([id]) => id));

  const nodes = matched.map(([id, rec]) => {
    const cover = rec.cover && (rec.cover.local || rec.cover.url);
    return {
      data: {
        id, type: 'anime',
        label: rec.titles.primary_zh || rec.titles.ja_romaji || id,
        cover: cover || '',
        score: rec.rating ? rec.rating.score : null,
        year: rec.year,
      },
    };
  });

  // Edges from precomputed graph.json
  const edges = [];
  if (graphAll && graphAll.edges) {
    graphAll.edges.forEach((e, i) => {
      if (!idSet.has(e.source) || !idSet.has(e.target)) return;
      // Drop noisy genre overlap edges in level 2; keep meaningful relations
      if (e.type === 'shared_genre') return;
      if (e.type === 'same_year') return;
      if (e.type !== 'franchise' && e.weight < 0.25) return;
      edges.push({ data: { id: 'e' + i, source: e.source, target: e.target, etype: e.type, weight: e.weight } });
    });
  }

  // Layout strength scales with count: more anime = more spread
  const N = matched.length;
  const repulsion = Math.max(2500, Math.min(12000, N * 60));
  const ideal = Math.max(60, Math.min(140, 50 + Math.sqrt(N) * 10));

  cy.elements().remove();
  cy.add(nodes); cy.add(edges);
  cy.layout({
    name: 'fcose', quality: 'proof', animate: true, animationDuration: 600,
    randomize: true, nodeRepulsion: repulsion, idealEdgeLength: ideal,
    edgeElasticity: 0.45, gravity: 0.15, padding: 60,
  }).run();
  cy.one('layoutstop', () => { initialZoomForLevel = cy.zoom(); });
}

function showAnimeInfo(node) {
  const id = node.id();
  const rec = anime[id];
  if (!rec) return;
  const box = document.getElementById('node-info');
  const cover = (rec.cover && (rec.cover.local || rec.cover.url)) || '';
  const score = rec.rating ? rec.rating.score : null;
  const studios = (rec.studios || []).join(' · ');
  const synopsis = rec.synopsis_zh || '(暫無中文簡介)';
  box.innerHTML = `
    <button class="close" onclick="hideInfo()" aria-label="關閉">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    ${cover ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(rec.titles.primary_zh || '')}" />` : ''}
    <h3>${escapeHtml(rec.titles.primary_zh || rec.titles.ja_romaji || '')}</h3>
    <div style="color: var(--fg-muted); font: 500 var(--fs-caption) var(--font-body); margin-top: var(--space-1); font-variant-numeric: tabular-nums;">
      ${rec.year || '?'} · ${escapeHtml(rec.format || '')} · ${rec.episodes || '?'} 集 · ${escapeHtml(studios)}
    </div>
    <div style="color: var(--star); margin: var(--space-3) 0; font: 700 var(--fs-h3) var(--font-display); font-variant-numeric: tabular-nums;">
      ${score != null ? score.toFixed(1) + ' ★' : '—'}
    </div>
    <div style="font: 400 var(--fs-body-sm)/1.7 var(--font-body); color: var(--fg); max-height: 220px; overflow-y: auto; margin-top: var(--space-3); white-space: pre-wrap;">${escapeHtml(synopsis)}</div>
    <div style="margin-top: var(--space-3); font: 500 var(--fs-caption) var(--font-body); color: var(--fg-faint);">分類: ${(rec.categories || []).join(', ')}</div>
    <div style="margin-top: var(--space-3);"><a href="index.html?id=${encodeURIComponent(id)}" style="color: var(--accent); font: 500 var(--fs-body-sm) var(--font-body);">在卡片視圖開啟 →</a></div>
  `;
  box.style.display = 'block';
}

function hideInfo() {
  document.getElementById('node-info').style.display = 'none';
}

load();
</script>
