<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<title>推薦留言 · kiuno-anime-viewer</title>
<link rel="stylesheet" href="styles.css?v=3" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body x-data="recommends" x-cloak x-init="init()">

<header class="header">
  <div class="header__row1">
    <div class="header__title">💬 推薦留言<small>kiuno</small></div>
    <div class="header__nav">
      <a href="index.html">卡片</a>
      <a href="graph.html">知識圖</a>
      <a href="recommends.html" class="active nav-link-recommends">留言</a>
      <a href="changelog.html" class="version-link nav-link-changelog" x-text="appVersion ? `v${appVersion}` : ''"></a>
    </div>
    <span class="count" style="margin-left:auto;" x-text="`${comments.length} 則`"></span>
  </div>
</header>

<!-- 提交表單 -->
<section class="recommend-form" x-show="ready" x-cloak>
  <h2>留下你的推薦</h2>

  <div x-show="!isConfigured" class="banner local-mode">
    <span>⚠ 留言系統尚未設定（Firebase config 未填）。請依 README 完成設定。</span>
  </div>

  <form @submit.prevent="submit()">
    <label class="form-row">
      <span class="form-label">暱稱</span>
      <input type="text" x-model="form.nickname" maxlength="20" required
             placeholder="你的名字" autocomplete="off" />
      <span class="form-hint" x-text="`${form.nickname.length}/20`"></span>
    </label>

    <div class="form-row">
      <span class="form-label">推薦動畫</span>
      <div class="chip-input" @click="$refs.bufferInput.focus()">
        <template x-for="(p, idx) in form.picks" :key="idx + ':' + (p.id || p.title)">
          <span class="chip-pill" :class="p.id ? 'matched' : 'unmatched'">
            <span class="chip-pill__title" x-text="p.title"></span>
            <span class="chip-pill__tag" x-text="p.id ? '✓' : '未收錄'"></span>
            <button type="button" class="chip-pill__remove"
                    @click.stop="removePick(idx)" :aria-label="`移除 ${p.title}`">×</button>
          </span>
        </template>
        <input type="text" x-ref="bufferInput"
               x-model="form.buffer" maxlength="100"
               :placeholder="form.picks.length === 0 ? '從清單裡選；自由輸入按空格成標籤' : ''"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               @input="onAnimeInput()" @focus="onAnimeInput()"
               @keydown="onBufferKeydown($event)"
               :disabled="form.picks.length >= maxPicks" />
      </div>
      <span class="form-hint" x-text="`${form.picks.length}/${maxPicks} 部`"></span>
      <ul class="autocomplete-list" x-show="autocompleteOpen && autocompleteResults.length > 0">
        <template x-for="r in autocompleteResults" :key="r.id">
          <li @mousedown.prevent="pickAnime(r)">
            <span class="ac-title" x-text="r.title"></span>
            <span class="ac-meta" x-text="`(${r.year || '?'})`"></span>
          </li>
        </template>
      </ul>
    </div>

    <label class="form-row">
      <span class="form-label">說明</span>
      <textarea x-model="form.description" maxlength="500" rows="4" required
                placeholder="為什麼推薦？最少 5 字、最多 500 字"></textarea>
      <span class="form-hint" x-text="`${form.description.length}/500`"></span>
    </label>

    <!-- honeypot：真人看不到，機器人會填 -->
    <input type="text" x-model="form.website" name="website" tabindex="-1"
           autocomplete="off" aria-hidden="true"
           style="position:absolute;left:-9999px;width:0;height:0;opacity:0" />

    <div class="form-actions">
      <span class="form-error" x-show="error" x-text="error" x-cloak></span>
      <button type="submit" class="pill-btn submit-btn"
              :disabled="submitting || !canSubmit"
              x-text="submitting ? '送出中…' : '送出推薦'"></button>
    </div>

    <p class="privacy-note">
      📋 提交即同意儲存 IP / 瀏覽器資訊作為防濫用紀錄。所有人都看得到你的留言。
    </p>
  </form>
</section>

<!-- 留言列表 -->
<section class="comments-list" x-show="ready" x-cloak>
  <div class="comments-header">
    <h2>所有推薦</h2>
    <span class="count" x-text="hasMore ? `${comments.length}+ 則` : `${comments.length} 則`"></span>
  </div>

  <div class="empty" x-show="!loading && comments.length === 0">
    <p>還沒有人留言，當第一個吧！</p>
  </div>
  <div class="empty" x-show="loading"><p>載入中…</p></div>

  <template x-for="c in comments" :key="c.id">
    <article class="comment-card">
      <div class="comment-head">
        <strong class="comment-name" x-text="c.nickname"></strong>
        <span class="comment-arrow">推薦</span>
        <a class="comment-anime"
           :href="c.anime_id ? `index.html?id=${encodeURIComponent(c.anime_id)}` : null"
           :class="{'no-link': !c.anime_id}"
           x-text="c.anime_title"></a>
        <span class="comment-tag" x-show="!c.anime_id" title="未收錄資料庫的條目">未收錄</span>
        <time class="comment-time" :datetime="c.createdAt?.toDate?.().toISOString()"
              x-text="formatTime(c.createdAt)"></time>
      </div>
      <p class="comment-body" x-text="c.description"></p>
    </article>
  </template>

  <div class="comments-footer" x-show="comments.length > 0">
    <button class="pill-btn" x-show="hasMore" @click="loadMore()" :disabled="loadingMore">
      <span x-text="loadingMore ? '載入中…' : '載入更多'"></span>
    </button>
    <p class="all-loaded" x-show="!hasMore">已顯示全部留言</p>
  </div>
</section>

<div class="toast" id="globalToast"></div>

<script type="module">
import { firebaseConfig, isConfigured } from "./firebase-config.js?v=1";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, limit, startAfter,
  onSnapshot, getDocs, serverTimestamp, writeBatch, doc,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/module.esm.js";
import { collectAudit, showToast, formatTime } from "./js/utils.js?v=1";

let db = null;
if (isConfigured) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
}

Alpine.data("recommends", () => ({
    ready: false,
    isConfigured,
    loading: true,
    submitting: false,
    error: "",
    loadingMore: false,
    hasMore: false,
    comments: [],
    lastDoc: null,
    pageSize: 20,
    fuse: null,
    animeIndex: [],

    form: {
      nickname: "",
      picks: [],          // [{id: string|null, title: string}, ...]
      buffer: "",          // 還沒成 chip 的輸入字
      description: "",
      website: "",         // honeypot
    },
    maxPicks: 10,
    autocompleteOpen: false,
    autocompleteResults: [],
    appVersion: "",

    async init() {
      // 版本號
      try {
        const vr = await fetch("data/version.json", { cache: "no-cache" });
        if (vr.ok) { const v = await vr.json(); this.appVersion = v.current || ""; }
      } catch (e) {}

      // 帶入上次留言的暱稱（純本機 localStorage）
      try {
        const savedNick = localStorage.getItem("recommendsNickname");
        if (savedNick) this.form.nickname = savedNick;
      } catch (e) {}

      // 載入 anime.json 給 autocomplete
      try {
        const r = await fetch("data/anime.json", { cache: "no-cache" });
        const db_ = await r.json();
        this.animeIndex = Object.values(db_.anime || {}).map(a => ({
          id: a.id,
          title: a.titles?.primary_zh || a.titles?.ja_romaji || a.id,
          ja: a.titles?.ja || "",
          en: a.titles?.en || "",
          year: a.year,
        }));
        this.fuse = new Fuse(this.animeIndex, {
          keys: ["title", "ja", "en"],
          threshold: 0.4,
          ignoreLocation: true,
        });
      } catch (e) {
        console.warn("anime.json load failed; autocomplete disabled", e);
      }

      this.ready = true;

      if (!isConfigured) {
        this.loading = false;
        return;
      }

      // realtime listener for first page
      const q = query(
        collection(db, "recommends"),
        orderBy("createdAt", "desc"),
        limit(this.pageSize)
      );
      onSnapshot(q, (snap) => {
        const fresh = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // 合併：保留已載入的「更舊」分頁，但首頁部分用最新串流結果替換
        const beyondFirstPage = this.comments.slice(this.pageSize);
        this.comments = [...fresh, ...beyondFirstPage];
        if (snap.docs.length > 0) {
          this.lastDoc = snap.docs[snap.docs.length - 1];
          this.hasMore = snap.docs.length === this.pageSize;
          // 標記留言已看 → 清掉 nav 紅點
          const ts = snap.docs[0].data().createdAt;
          const millis = ts && ts.toMillis ? ts.toMillis() : 0;
          if (millis && window.markCommentsSeen) window.markCommentsSeen(millis);
        }
        this.loading = false;
      }, (err) => {
        console.error("onSnapshot error", err);
        this.loading = false;
        this.error = "讀取留言失敗：" + err.message;
      });
    },

    onAnimeInput() {
      const q = this.form.buffer.trim();
      if (!q || !this.fuse) {
        this.autocompleteResults = [];
        this.autocompleteOpen = false;
        return;
      }
      const pickedIds = new Set(this.form.picks.filter(p => p.id).map(p => p.id));
      const pickedTitles = new Set(this.form.picks.map(p => p.title));
      const hits = this.fuse.search(q).slice(0, 12)
        .map(h => h.item)
        .filter(item => !pickedIds.has(item.id) && !pickedTitles.has(item.title))
        .slice(0, 8);
      this.autocompleteResults = hits;
      this.autocompleteOpen = true;
    },

    pickAnime(item) {
      if (this.form.picks.length >= this.maxPicks) return;
      const dup = this.form.picks.some(p => (p.id && p.id === item.id) || p.title === item.title);
      if (!dup) this.form.picks.push({ id: item.id, title: item.title });
      this.form.buffer = "";
      this.autocompleteOpen = false;
      this.autocompleteResults = [];
    },

    addPickFromBuffer() {
      const t = this.form.buffer.trim();
      if (!t) return;
      if (t.length > 100) return;
      if (this.form.picks.length >= this.maxPicks) return;
      const dup = this.form.picks.some(p => p.title === t);
      if (!dup) this.form.picks.push({ id: null, title: t });
      this.form.buffer = "";
      this.autocompleteOpen = false;
      this.autocompleteResults = [];
    },

    removePick(idx) {
      this.form.picks.splice(idx, 1);
      this.onAnimeInput();
    },

    onBufferKeydown(e) {
      if (e.key === " " || e.key === "Spacebar") {
        if (this.form.buffer.trim().length > 0) {
          e.preventDefault();
          this.addPickFromBuffer();
        }
      } else if (e.key === "Enter") {
        if (this.form.buffer.trim().length > 0) {
          e.preventDefault();
          this.addPickFromBuffer();
        }
      } else if (e.key === "Backspace" &&
                 this.form.buffer.length === 0 &&
                 this.form.picks.length > 0) {
        e.preventDefault();
        this.form.picks.pop();
      }
    },

    get canSubmit() {
      const hasPick = this.form.picks.length > 0 || this.form.buffer.trim().length > 0;
      return this.form.nickname.trim().length > 0 &&
             hasPick &&
             this.form.description.trim().length >= 5;
    },

    async submit() {
      this.error = "";
      if (!isConfigured) {
        this.error = "留言系統尚未設定（Firebase config 未填）";
        return;
      }
      if (this.form.website) return;  // honeypot

      // 把還在 buffer 的內容也 commit 成 pick
      if (this.form.buffer.trim().length > 0) this.addPickFromBuffer();

      if (this.form.picks.length === 0) { this.error = "至少要選一部動畫"; return; }
      if (this.form.picks.length > this.maxPicks) { this.error = `最多 ${this.maxPicks} 部`; return; }
      if (!this.form.nickname.trim()) { this.error = "請填暱稱"; return; }
      if (this.form.nickname.length > 20) { this.error = "暱稱最多 20 字"; return; }
      if (this.form.description.trim().length < 5) { this.error = "說明至少 5 字"; return; }
      if (this.form.description.length > 500) { this.error = "說明最多 500 字"; return; }
      for (const p of this.form.picks) {
        if (!p.title || p.title.length > 100) { this.error = `動畫名長度錯誤：${p.title}`; return; }
      }

      // client rate limit
      const lastSubmit = parseInt(localStorage.getItem("recommendsLastSubmit") || "0", 10);
      const now = Date.now();
      if (now - lastSubmit < 60_000) {
        const wait = Math.ceil((60_000 - (now - lastSubmit)) / 1000);
        this.error = `請稍候 ${wait} 秒再留言`;
        return;
      }

      this.submitting = true;
      try {
        const audit = await collectAudit();
        const nick = this.form.nickname.trim();
        const desc = this.form.description.trim();
        const batch = writeBatch(db);
        const colRef = collection(db, "recommends");
        for (const p of this.form.picks) {
          const docRef = doc(colRef);
          batch.set(docRef, {
            nickname: nick,
            anime_id: p.id || null,
            anime_title: p.title,
            description: desc,
            createdAt: serverTimestamp(),
            audit,
          });
        }
        await batch.commit();
        localStorage.setItem("recommendsLastSubmit", String(now));
        try { localStorage.setItem("recommendsNickname", nick); } catch (e) {}
        const count = this.form.picks.length;
        this.form.picks = [];
        this.form.buffer = "";
        this.form.description = "";
        showToast(`已送出 ${count} 部推薦，謝謝！`);
      } catch (e) {
        console.error(e);
        this.error = "送出失敗：" + (e.message || e);
      } finally {
        this.submitting = false;
      }
    },

    async loadMore() {
      if (!db || !this.lastDoc || this.loadingMore) return;
      this.loadingMore = true;
      try {
        const q = query(
          collection(db, "recommends"),
          orderBy("createdAt", "desc"),
          startAfter(this.lastDoc),
          limit(this.pageSize)
        );
        const snap = await getDocs(q);
        const more = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        this.comments = [...this.comments, ...more];
        if (snap.docs.length > 0) {
          this.lastDoc = snap.docs[snap.docs.length - 1];
        }
        this.hasMore = snap.docs.length === this.pageSize;
      } catch (e) {
        console.error(e);
        this.error = "載入更多失敗：" + e.message;
      } finally {
        this.loadingMore = false;
      }
    },

    formatTime,  // 借用 utils.js 的 export 給 template 使用
  }));

// 都註冊好才啟動 Alpine
window.Alpine = Alpine;
Alpine.start();
</script>
<script type="module" src="indicator.js?v=1"></script>
</body>
</html>
