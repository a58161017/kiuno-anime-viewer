name: Deploy to GitHub Pages

# 部署 kiuno-anime-viewer 到 GitHub Pages，把 Firebase config 從 GitHub
# Secrets 注入 firebase-config.js，避免實值寫進 source。

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config from secrets
        run: |
          cat > firebase-config.js <<EOF
          // Auto-generated by .github/workflows/deploy.yml.
          // 真實值來自 GitHub Secrets。Source repo 的 firebase-config.js 只是 placeholder。
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            projectId: "${{ secrets.FIREBASE_PROJECT_ID }}",
            storageBucket: "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            appId: "${{ secrets.FIREBASE_APP_ID }}",
          };
          export const isConfigured = !Object.values(firebaseConfig).some(
            (v) => !v || v === "REPLACE_ME" || (typeof v === "string" && v.startsWith("REPLACE_ME"))
          );
          EOF
          echo "Generated firebase-config.js (values redacted)"
          grep -E '^\s*(apiKey|projectId):' firebase-config.js | sed 's/".*"/"<redacted>"/'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
